name: Fundamental V9 Reconciled-Zero Target Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Verify exact 688001.SH 2025Q1 target
        run: |
          python scripts/verify_fundamental_v9_reconciled_zero_688001.py \
            --output-dir stage/fundamental-v9-reconciled-zero-688001
      - name: Upload verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: fundamental-v9-reconciled-zero-688001-2025q1
          path: stage/fundamental-v9-reconciled-zero-688001
          if-no-files-found: error
          retention-days: 90
