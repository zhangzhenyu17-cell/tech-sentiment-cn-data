name: one-shot official CSI 931152 evidence probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-csi-931152.yml"
      - "scripts/research/probe_csi_931152_old_attachments.py"

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'research/931152-csi-evidence-run'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install research dependencies
        run: python -m pip install -e ".[sector-data]"
      - name: Run legacy official CSI attachment fallback probe
        run: |
          python scripts/research/probe_csi_931152_old_attachments.py \
            --output-dir /tmp/931152-csi-legacy-evidence \
            --timeout 45
      - name: Show report
        if: always()
        run: cat /tmp/931152-csi-legacy-evidence/report.json || true
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 931152-csi-legacy-official-evidence
          path: /tmp/931152-csi-legacy-evidence
          if-no-files-found: error
          retention-days: 14
