name: v4a-05-issuer-aggregate

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Qualification start date"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Qualification end date"
        required: true
        default: "2026-09-17"
        type: string

concurrency:
  group: v4a-issuer-aggregate-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download and verify shared bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/shared bundle-meta stage/shared
          python scripts/v4a_persistent_stage_bundle.py key --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --out bundle-meta/shared-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/shared-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/shared
          cp "bundle/shared/${BASE}.manifest.json" bundle-meta/shared.json
          python scripts/v4a_persistent_stage_bundle.py verify --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --archive "bundle/shared/${BASE}.tar.gz" --manifest bundle-meta/shared.json --extract-to stage/shared
      - name: Download and exact-verify frozen issuer source bundles
        env:
          GH_TOKEN: ${{ github.token }}
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract_path = Path(
              "reference/v4a_issuer_source_aggregate_compatibility_bridge_v1.json"
          )
          contract = json.loads(contract_path.read_text(encoding="utf-8"))
          if (
              contract.get("schema_version")
              != "v4a-issuer-source-aggregate-compatibility-bridge-v1"
          ):
              raise SystemExit("issuer aggregate compatibility bridge schema mismatch")
          if contract.get("status") != "FROZEN_ONE_TIME_ENGINEERING_COMPATIBILITY":
              raise SystemExit("issuer aggregate compatibility bridge is not frozen")
          window = contract.get("qualification_window") or {}
          if (
              os.environ["START_DATE"] != str(window.get("start_date"))
              or os.environ["END_DATE"] != str(window.get("end_date"))
          ):
              raise SystemExit("issuer aggregate compatibility bridge window mismatch")
          if contract.get("release_tag") != "v4a-stage-bundles-v1":
              raise SystemExit("issuer aggregate compatibility release tag mismatch")
          if int(contract.get("triggering_failure_run_id") or 0) != 35453638482:
              raise SystemExit("issuer aggregate compatibility trigger run mismatch")

          drift = contract.get("allowed_producer_drift") or {}
          if drift.get("path") != "scripts/assert_v4a_stage_qualifiable.py":
              raise SystemExit("issuer aggregate allowlisted producer drift path mismatch")
          if (
              drift.get("source_sha256")
              != "95fb8a1ed533fb906d1e09aba549c8541fad6caec65115e3f17e92dc5a4aea55"
              or int(drift.get("source_bytes") or 0) != 9390
              or drift.get("current_sha256")
              != "fb65819177c756e4dcf05d9d93704957a0a2fb83ee64f1a23bfadb1fd0cc8fbb"
              or int(drift.get("current_bytes") or 0) != 10459
              or drift.get("classification")
              != "FUNDAMENTAL_ONLY_QUALIFICATION_TOLERANCE_AND_DATA_INSUFFICIENCY_LOGIC"
              or drift.get("issuer_source_gate_semantics_changed") is not False
              or drift.get("issuer_materialization_semantics_changed") is not False
          ):
              raise SystemExit("issuer aggregate allowlisted producer drift identity mismatch")

          invariants = contract.get("invariants") or {}
          for key in (
              "exact_manifest_identity_required",
              "exact_archive_sha256_required",
              "exact_archive_bytes_required",
              "exact_stage_receipt_sha256_required",
              "exact_shared_input_identity_required",
              "current_producer_file_set_must_match_source_manifest",
              "all_non_allowlisted_producer_files_must_match_source_manifest_sha256",
              "allowlisted_drift_requires_exact_old_and_current_sha256",
          ):
              if invariants.get(key) is not True:
                  raise SystemExit(f"issuer aggregate compatibility invariant missing: {key}")
          for key in (
              "provider_refetch_allowed",
              "source_bundle_republication_allowed",
              "new_qualification_granted",
              "formal_evidence_handoff",
              "evidence_source_eligibility_changed",
              "pit_no_lookahead_semantics_changed",
              "research_scope_changed",
              "future_outcomes_used",
              "model_thresholds_changed",
              "signal_definitions_changed",
              "production_authority_changed",
              "trading_authority_changed",
          ):
              if invariants.get(key) is not False:
                  raise SystemExit(f"issuer aggregate compatibility boundary drift: {key}")

          expected_sources = {
              "issuer_cninfo": {
                  "source_run_id": 35384463289,
                  "run_attempt": 1,
                  "source_commit": "29571066bbf69da5ba252982f71b592e07969314",
                  "asset_base": "v4a-issuer_cninfo-20220104-20260917-fbac0195c08c71c7ad87",
                  "producer_fingerprint": "3c1efc8910a179b846b5c40e71b2931aecfbd7a18be0b182f4fa717743fc1e4b",
                  "compatibility_key": "fbac0195c08c71c7ad874a9da91daec292b3c0f63ecc2729a7efd8ae7b030123",
                  "bundle_identity": "717dd2b443b0e3def34f760335c172453a0d71e42e8783f074e9d51b679c515f",
                  "archive_sha256": "10f4c7981f063f2a49c90c19fc36b39678eab1828289195f797c96be3d450a81",
                  "archive_bytes": 25495502,
                  "stage_receipt_sha256": "2601b61fab94a5ca18b08280ca00c9d018923e098df3d242efea2ba26102b39b",
              },
              "issuer_sse": {
                  "source_run_id": 35384501342,
                  "run_attempt": 1,
                  "source_commit": "29571066bbf69da5ba252982f71b592e07969314",
                  "asset_base": "v4a-issuer_sse-20220104-20260917-a0517a42213d8f50baf9",
                  "producer_fingerprint": "8ba02fdd58eb811389ad712c47c98727aef9526b9cfc07dd6dba7bbc88c2ca11",
                  "compatibility_key": "a0517a42213d8f50baf907537fcac51adfc95a19d0b4c322df8a3be26bb4cd4d",
                  "bundle_identity": "925d9894aebba600f6ee6f7b97ee365c8171e61067221c93b1677351177d6e6d",
                  "archive_sha256": "8abd6156e6bcf4270fb097e03a4c801091fe01e7032d3550741311671c92e9b7",
                  "archive_bytes": 5813479,
                  "stage_receipt_sha256": "f62497e7417fcebfd33fad119db4148248348246f38d46aa813ede72c5c295c0",
              },
              "issuer_szse": {
                  "source_run_id": 35419134679,
                  "run_attempt": 1,
                  "source_commit": "396b7d4bc88022c62212ea30809718f25893f90e",
                  "asset_base": "v4a-issuer_szse-20220104-20260917-9d60092b6b8709fe4096",
                  "producer_fingerprint": "526c3e3baa51fc307844218267f09e8c5852c99b6a92e41e7aa1df69a71bf662",
                  "compatibility_key": "9d60092b6b8709fe4096e04c716ca67d8ac94d99963356cc4c31deaaa9adacbf",
                  "bundle_identity": "41387484fd4e2d83aa33d55a30a02bfea8dbb995dd05c8d03bd61a3eba840d10",
                  "archive_sha256": "ae62c49ae7d9f710f147f61dd197a66a27187b8fa2a8ea43c3f1dcdbd3777eaa",
                  "archive_bytes": 18613421,
                  "stage_receipt_sha256": "242742f3d0313a7051d840bfa96f179567c4faab2e0a45a95f6ba68b400c1fb6",
              },
          }
          sources = contract.get("sources") or {}
          for family, expected in expected_sources.items():
              actual = sources.get(family) or {}
              for key, value in expected.items():
                  if actual.get(key) != value:
                      raise SystemExit(
                          f"issuer aggregate exact source identity mismatch: {family}:{key}"
                      )
              if actual.get("stage_kind") != "issuer_source_group":
                  raise SystemExit(f"issuer aggregate source stage kind mismatch: {family}")
              expected_stage_id = {
                  "issuer_cninfo": "issuer-cninfo-all",
                  "issuer_sse": "issuer-sse-all",
                  "issuer_szse": "issuer-szse-all",
              }[family]
              if actual.get("stage_id") != expected_stage_id:
                  raise SystemExit(f"issuer aggregate source stage id mismatch: {family}")

          plan = {
              family: {"asset_base": payload["asset_base"]}
              for family, payload in expected_sources.items()
          }
          Path("bundle-meta").mkdir(parents=True, exist_ok=True)
          Path("bundle-meta/issuer-compat-plan.json").write_text(
              json.dumps(plan, sort_keys=True, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          mkdir -p stage/issuer
          for source in cninfo sse szse; do
            family="issuer_${source}"
            mkdir -p "bundle/${family}" "inputs/${family}"
            base="$(python -c "import json; print(json.load(open('bundle-meta/issuer-compat-plan.json'))['${family}']['asset_base'])")"
            bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$base" "bundle/${family}"
            cp "bundle/${family}/${base}.manifest.json" "bundle-meta/${family}.json"
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from tech_sentiment.v4a_persistent_stage import (
              _load_manifest,
              _safe_extract,
              _validate_family_stage_contract,
              input_bundle_identities,
              producer_fingerprint,
          )
          from tech_sentiment.v4a_stage_artifact import file_sha256, verify_stage_receipt

          contract = json.loads(
              Path(
                  "reference/v4a_issuer_source_aggregate_compatibility_bridge_v1.json"
              ).read_text(encoding="utf-8")
          )
          drift = contract["allowed_producer_drift"]
          current_drift_path = Path(drift["path"])
          if (
              file_sha256(current_drift_path) != drift["current_sha256"]
              or current_drift_path.stat().st_size != int(drift["current_bytes"])
          ):
              raise SystemExit(
                  "issuer aggregate current allowlisted producer drift no longer exact"
              )

          shared_manifest = _load_manifest("bundle-meta/shared.json")
          shared_expected = contract["shared_input"]
          for key in (
              "family",
              "stage_id",
              "asset_base",
              "original_source_commit",
              "producer_fingerprint",
              "compatibility_key",
              "bundle_identity",
              "archive_sha256",
              "stage_receipt_sha256",
          ):
              if shared_manifest.get(key) != shared_expected.get(key):
                  raise SystemExit(f"issuer aggregate shared identity mismatch: {key}")
          if shared_expected.get("asset_base") != (
              "v4a-shared-20220104-20260917-d5746186eea108591194"
          ):
              raise SystemExit("issuer aggregate frozen shared asset base mismatch")
          current_shared_identity = input_bundle_identities(
              {"shared": "bundle-meta/shared.json"}
          )["shared"]

          for family in ("issuer_cninfo", "issuer_sse", "issuer_szse"):
              expected = contract["sources"][family]
              base = expected["asset_base"]
              manifest_path = Path("bundle-meta") / f"{family}.json"
              archive_path = Path("bundle") / family / f"{base}.tar.gz"
              manifest = _load_manifest(manifest_path)

              exact_fields = {
                  "family": family,
                  "stage_kind": expected["stage_kind"],
                  "stage_id": expected["stage_id"],
                  "start_date": os.environ["START_DATE"],
                  "end_date": os.environ["END_DATE"],
                  "producer_fingerprint": expected["producer_fingerprint"],
                  "compatibility_key": expected["compatibility_key"],
                  "bundle_identity": expected["bundle_identity"],
                  "archive_sha256": expected["archive_sha256"],
                  "archive_bytes": expected["archive_bytes"],
                  "stage_receipt_sha256": expected["stage_receipt_sha256"],
                  "original_source_commit": expected["source_commit"],
                  "release_tag": "v4a-stage-bundles-v1",
              }
              for key, value in exact_fields.items():
                  if manifest.get(key) != value:
                      raise SystemExit(
                          f"issuer aggregate immutable manifest mismatch: {family}:{key}"
                      )
              if manifest.get("input_bundles") != {"shared": current_shared_identity}:
                  raise SystemExit(
                      f"issuer aggregate shared input lineage mismatch: {family}"
                  )

              source_rows = {
                  row["path"]: row for row in (manifest.get("producer_files") or [])
              }
              current_rows = {
                  row["path"]: row
                  for row in producer_fingerprint(".", family)["producer_files"]
              }
              if set(source_rows) != set(current_rows):
                  raise SystemExit(
                      f"issuer aggregate producer file set drift: {family}"
                  )
              for path, old_row in source_rows.items():
                  current_row = current_rows[path]
                  if path == drift["path"]:
                      if (
                          old_row.get("sha256") != drift["source_sha256"]
                          or int(old_row.get("bytes") or 0) != int(drift["source_bytes"])
                          or current_row.get("sha256") != drift["current_sha256"]
                          or int(current_row.get("bytes") or 0)
                          != int(drift["current_bytes"])
                      ):
                          raise SystemExit(
                              f"issuer aggregate allowlisted producer drift mismatch: {family}"
                          )
                  elif (
                      old_row.get("sha256") != current_row.get("sha256")
                      or int(old_row.get("bytes") or 0)
                      != int(current_row.get("bytes") or 0)
                  ):
                      raise SystemExit(
                          f"issuer aggregate non-allowlisted producer drift: {family}:{path}"
                      )

              if file_sha256(archive_path) != expected["archive_sha256"]:
                  raise SystemExit(
                      f"issuer aggregate archive SHA256 mismatch: {family}"
                  )
              if archive_path.stat().st_size != int(expected["archive_bytes"]):
                  raise SystemExit(
                      f"issuer aggregate archive byte-size mismatch: {family}"
                  )

              target = Path("inputs") / family
              if target.exists() and any(target.iterdir()):
                  raise SystemExit(
                      f"issuer aggregate extraction target is not empty: {family}"
                  )
              _safe_extract(archive_path, target)
              _validate_family_stage_contract(target, family)
              receipt = verify_stage_receipt(
                  root=target,
                  receipt_path=target / "receipt.json",
                  source_commit=expected["source_commit"],
                  stage_kind=expected["stage_kind"],
                  stage_id=expected["stage_id"],
                  start_date=os.environ["START_DATE"],
                  end_date=os.environ["END_DATE"],
              )
              if (
                  receipt.get("receipt_sha256") != expected["stage_receipt_sha256"]
                  or manifest.get("stage_receipt_sha256")
                  != expected["stage_receipt_sha256"]
              ):
                  raise SystemExit(
                      f"issuer aggregate stage receipt identity mismatch: {family}"
                  )
              print(
                  json.dumps(
                      {
                          "family": family,
                          "asset_base": base,
                          "bundle_identity": expected["bundle_identity"],
                          "source_run_id": expected["source_run_id"],
                          "source_commit": expected["source_commit"],
                          "provider_refetch": False,
                          "compatibility_bridge": True,
                      },
                      sort_keys=True,
                  )
              )
          PY

          for source in cninfo sse szse; do
            family="issuer_${source}"
            cp -a "inputs/${family}/shards/." stage/issuer/
          done
      - name: Aggregate issuer sources
        run: |
          CNINFO_COMMIT="$(python -c 'import json; print(json.load(open("bundle-meta/issuer_cninfo.json"))["original_source_commit"])' )"
          SSE_COMMIT="$(python -c 'import json; print(json.load(open("bundle-meta/issuer_sse.json"))["original_source_commit"])' )"
          SZSE_COMMIT="$(python -c 'import json; print(json.load(open("bundle-meta/issuer_szse.json"))["original_source_commit"])' )"
          mkdir -p stage/issuer_aggregate
          python scripts/aggregate_v4a_issuer_shards.py \
            --shard-root stage/issuer \
            --symbols-csv stage/shared/pit_symbol_scope/capital_pit_symbols.csv \
            --source-commit "${{ github.sha }}" \
            --cninfo-source-commit "$CNINFO_COMMIT" \
            --sse-source-commit "$SSE_COMMIT" \
            --szse-source-commit "$SZSE_COMMIT" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --out-dir stage/issuer_aggregate
      - name: Seal issuer aggregate
        run: |
          python scripts/write_v4a_stage_receipt.py --root stage/issuer_aggregate \
            --stage-kind issuer_aggregate --stage-id issuer_aggregate \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --out stage/issuer_aggregate/receipt.json
      - name: Package persistent issuer aggregate
        run: |
          mkdir -p dist
          python scripts/v4a_persistent_stage_bundle.py package --family issuer_aggregate \
            --stage-root stage/issuer_aggregate --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json \
            --input-manifest cninfo=bundle-meta/issuer_cninfo.json \
            --input-manifest sse=bundle-meta/issuer_sse.json \
            --input-manifest szse=bundle-meta/issuer_szse.json \
            --out-dir dist --out dist/package.json
      - name: Publish immutable issuer aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(python -c 'import json; print(json.load(open("dist/package.json"))["asset_base"])' )"
          bash scripts/publish_v4a_release_bundle.sh v4a-stage-bundles-v1 dist "$BASE"
      - name: Upload convenient 90-day bundle copy
        uses: actions/upload-artifact@v4
        with:
          name: v4a-persistent-issuer-aggregate-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 90
