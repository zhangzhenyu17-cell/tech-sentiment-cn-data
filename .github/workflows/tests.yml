name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
      - name: Test
        run: pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test external watchdog
        run: node --test infra/cloudflare/prospective-external-watchdog-v1/test/worker.test.mjs
