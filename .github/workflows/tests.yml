name: tests

on:
  pull_request:
  push:
    branches: [main]


concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
      - name: Test
        run: pytest -q
