name: prospective-public-continuous-collector-v3

on:
  workflow_dispatch:
    inputs:
      market_session_date:
        description: Exact market session T; optional for scheduled-style resolution
        required: false
        type: string
      decision_date:
        description: Immediate next A-share trading day T+1; optional with market_session_date
        required: false
        type: string
  schedule:
    # 15:15 Asia/Shanghai onward: persist source availability close to publication.
    - cron: "15,45 7-23 * * *"
    # Near the 08:45 eligibility cutoff, observe every five minutes.
    - cron: "15,20,25,30,35,40,45 0 * * *"
    # The 08:45 dispatch is late-recovery only unless source-fetch completion itself
    # is still no later than the immutable 08:45 eligibility cutoff.
    # Late-recovery capture continues after the 08:45 eligibility cutoff.
    - cron: "15 1,2,4,6 * * *"

permissions:
  actions: write
  contents: write

concurrency:
  group: prospective-public-continuous-collector-v3
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Install frozen formal V3 collection environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "akshare==1.18.94" "pandas==3.0.5"
          python -m pip install -e ".[data]"
          python -m pip check

      - name: Resolve exact V3 capture pair
        id: pair
        env:
          INPUT_SESSION: ${{ inputs.market_session_date }}
          INPUT_DECISION: ${{ inputs.decision_date }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          from datetime import datetime, time
          import os
          from zoneinfo import ZoneInfo
          import akshare as ak
          import pandas as pd

          zone = ZoneInfo("Asia/Shanghai")
          now = datetime.now(zone)
          raw = ak.tool_trade_date_hist_sina()
          col = "trade_date" if "trade_date" in raw.columns else raw.columns[0]
          dates = (
              pd.to_datetime(raw[col], errors="raise")
              .dt.normalize()
              .drop_duplicates()
              .sort_values()
              .dt.date.tolist()
          )
          session = (os.environ.get("INPUT_SESSION") or "").strip()
          decision = (os.environ.get("INPUT_DECISION") or "").strip()
          event = os.environ["EVENT_NAME"]
          should_run = True
          reason = "EXPLICIT_V3_PAIR"

          if bool(session) != bool(decision):
              raise SystemExit("V3_MANUAL_PAIR_REQUIRES_BOTH_SESSION_AND_DECISION")

          if not session:
              local_clock = now.time().replace(tzinfo=None)
              if event == "schedule" and not (
                  local_clock >= time(23, 45) or local_clock <= time(14, 30)
              ):
                  should_run = False
                  reason = "OUTSIDE_V3_SCHEDULED_COLLECTION_RUNTIME"
              if should_run:
                  closed = [
                      value
                      for value in dates
                      if datetime.combine(value, time(15, 0), tzinfo=zone) <= now
                  ]
                  if not closed:
                      should_run = False
                      reason = "NO_CLOSED_A_SHARE_SESSION"
                  else:
                      s = closed[-1]
                      later = [value for value in dates if value > s]
                      if not later:
                          raise SystemExit("V3_TRADING_CALENDAR_HAS_NO_NEXT_SESSION")
                      session = s.isoformat()
                      decision = later[0].isoformat()
                      reason = "RESOLVED_LATEST_CLOSED_SESSION"

          if should_run:
              s = datetime.fromisoformat(session).date()
              d = datetime.fromisoformat(decision).date()
              if s not in dates or d not in dates:
                  raise SystemExit("V3_PAIR_NOT_CONFIRMED_A_SHARE_TRADING_DAYS")
              later = [value for value in dates if value > s]
              if not later or later[0] != d:
                  raise SystemExit("V3_DECISION_NOT_IMMEDIATE_NEXT_A_SHARE_TRADING_DAY")
              if now < datetime.combine(s, time(15, 0), tzinfo=zone):
                  raise SystemExit("V3_CAPTURE_BEFORE_SESSION_CLOSE")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as h:
              h.write(f"should_run={'true' if should_run else 'false'}\n")
              h.write(f"market_session_date={session}\n")
              h.write(f"decision_date={decision}\n")
              h.write(f"reason={reason}\n")
          print(
              f"should_run={should_run} session={session} decision={decision} "
              f"reason={reason} now={now.isoformat()}"
          )
          PY

      - name: Resolve and heal immutable source observations
        if: steps.pair.outputs.should_run == 'true'
        id: missing
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SESSION_DATE: ${{ steps.pair.outputs.market_session_date }}
        run: |
          set -euo pipefail
          SOURCES=(SSE_588000 SZSE_159915 SSE_TURNOVER SZSE_TURNOVER)
          missing=()
          mkdir -p existing-v3 healed-v3
          for SOURCE in "${SOURCES[@]}"; do
            TAG="prospective-source-observation-v3-${MARKET_SESSION_DATE}-${SOURCE}"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              missing+=("$SOURCE")
              continue
            fi
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            ARCHIVE="$TAG.tar.gz"
            CHECKSUM="$TAG.sha256"
            MANIFEST="$TAG.manifest.json"
            complete=true
            for REQUIRED in "$ARCHIVE" "$CHECKSUM" "$MANIFEST"; do
              grep -Fxq "$REQUIRED" <<<"$ASSETS" || complete=false
            done
            if [ "$complete" = "true" ]; then
              echo "Immutable V3 source already complete: $TAG"
              continue
            fi
            if ! grep -Fxq "$ARCHIVE" <<<"$ASSETS"; then
              echo "V3_PARTIAL_RELEASE_WITHOUT_ARCHIVE: $TAG" >&2
              exit 1
            fi
            rm -rf existing-v3/* healed-v3/*
            gh release download "$TAG" --pattern "$ARCHIVE" --dir existing-v3
            python scripts/heal_prospective_source_observation_v3.py \
              --archive "existing-v3/$ARCHIVE" \
              --output-dir healed-v3
            for LOCAL in "healed-v3/$CHECKSUM" "healed-v3/$MANIFEST"; do
              NAME="$(basename "$LOCAL")"
              if grep -Fxq "$NAME" <<<"$ASSETS"; then
                gh release download "$TAG" --pattern "$NAME" --dir existing-v3
                cmp --silent "$LOCAL" "existing-v3/$NAME" || {
                  echo "V3_IMMUTABLE_SOURCE_RELEASE_CONFLICT: $TAG/$NAME" >&2
                  exit 1
                }
              else
                gh release upload "$TAG" "$LOCAL"
              fi
            done
            FINAL="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for REQUIRED in "$ARCHIVE" "$CHECKSUM" "$MANIFEST"; do
              grep -Fxq "$REQUIRED" <<<"$FINAL" || {
                echo "V3_SOURCE_RELEASE_INCOMPLETE_AFTER_HEAL: $TAG/$REQUIRED" >&2
                exit 1
              }
            done
          done
          CSV="$(IFS=,; echo "${missing[*]-}")"
          echo "sources=$CSV" >> "$GITHUB_OUTPUT"
          if [ -z "$CSV" ]; then
            echo "all_complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "all_complete=false" >> "$GITHUB_OUTPUT"
          fi
          echo "Missing V3 sources: ${CSV:-none}"

      - name: Capture only missing public source observations
        if: steps.pair.outputs.should_run == 'true' && steps.missing.outputs.all_complete != 'true'
        env:
          PROSPECTIVE_TRANSPORT_ORIGIN: GITHUB_HOSTED
        run: |
          python scripts/capture_prospective_public_sources_v3.py \
            --market-session-date "${{ steps.pair.outputs.market_session_date }}" \
            --decision-date "${{ steps.pair.outputs.decision_date }}" \
            --source-commit "$GITHUB_SHA" \
            --sources "${{ steps.missing.outputs.sources }}"

      - name: Classify incomplete V3 source attempt
        if: steps.pair.outputs.should_run == 'true' && steps.missing.outputs.all_complete != 'true'
        id: attempt_outcome
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("dist/prospective_source_observations_v3/SOURCE_OBSERVATION_ATTEMPT.json")
          payload = json.loads(path.read_text(encoding="utf-8"))
          def csv(key: str) -> str:
              return ",".join(payload.get(key) or [])
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"transport_sources={csv('transport_failure_sources')}\n")
              handle.write(f"pending_sources={csv('publication_pending_sources')}\n")
              handle.write(f"review_sources={csv('review_required_sources')}\n")
              handle.write(f"all_complete={'true' if payload.get('all_sources_complete') else 'false'}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write("## Formal V3 source attempt\n")
              handle.write(f"- transport failures: {csv('transport_failure_sources') or 'none'}\n")
              handle.write(f"- publication pending: {csv('publication_pending_sources') or 'none'}\n")
              handle.write(f"- review required: {csv('review_required_sources') or 'none'}\n")
          PY

      - name: Publish each successful source observation immutably
        if: steps.pair.outputs.should_run == 'true' && steps.missing.outputs.all_complete != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ROOT="dist/prospective_source_observation_packages_v3"
          shopt -s nullglob
          mkdir -p existing-publish-v3
          for MANIFEST in "$ROOT"/*.manifest.json; do
            TAG="$(python - "$MANIFEST" <<'PY'
          import json, sys
          print(json.load(open(sys.argv[1], encoding="utf-8"))["release_tag"])
          PY
            )"
            ARCHIVE="$ROOT/$TAG.tar.gz"
            CHECKSUM="$ROOT/$TAG.sha256"
            if ! gh release view "$TAG" >/dev/null 2>&1; then
              gh release create "$TAG" \
                --target "$GITHUB_SHA" \
                --title "Prospective source observation V3 $TAG" \
                --notes "Formal V3 capture source observation. This source package alone grants no evidence handoff; first_observed_at is immutable. No historical backfill, outcome read, Production change, or trading authority."
            fi
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for LOCAL in "$ARCHIVE" "$CHECKSUM" "$MANIFEST"; do
              NAME="$(basename "$LOCAL")"
              if grep -Fxq "$NAME" <<<"$ASSETS"; then
                rm -f "existing-publish-v3/$NAME"
                gh release download "$TAG" --pattern "$NAME" --dir existing-publish-v3
                cmp --silent "$LOCAL" "existing-publish-v3/$NAME" || {
                  echo "V3_IMMUTABLE_SOURCE_RELEASE_CONFLICT: $TAG/$NAME" >&2
                  exit 1
                }
              else
                gh release upload "$TAG" "$LOCAL"
              fi
              ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            done
            FINAL="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            for REQUIRED in "$TAG.tar.gz" "$TAG.sha256" "$TAG.manifest.json"; do
              grep -Fxq "$REQUIRED" <<<"$FINAL" || {
                echo "V3_SOURCE_RELEASE_INCOMPLETE_AFTER_PUBLISH: $TAG/$REQUIRED" >&2
                exit 1
              }
            done
          done

      - name: Upload V3 capture attempt diagnostics
        if: steps.pair.outputs.should_run == 'true' && steps.missing.outputs.all_complete != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: prospective-public-source-observation-v3-${{ steps.pair.outputs.market_session_date }}-${{ github.run_id }}
          path: |
            dist/prospective_source_observations_v3/
            dist/prospective_source_observation_packages_v3/
          if-no-files-found: error
          retention-days: 30

      - name: Escalate transport failures to macOS fallback
        if: steps.pair.outputs.should_run == 'true' && steps.attempt_outcome.outputs.transport_sources != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ACTIVE="$(
            gh run list \
              --workflow prospective-public-continuous-collector-v3-macos-fallback.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "V3 macOS fallback already active; not dispatching duplicate."
            exit 0
          fi
          gh workflow run prospective-public-continuous-collector-v3-macos-fallback.yml \
            --ref main \
            -f market_session_date="${{ steps.pair.outputs.market_session_date }}" \
            -f decision_date="${{ steps.pair.outputs.decision_date }}"
          echo "Dispatched macOS fallback for transport-class failures: ${{ steps.attempt_outcome.outputs.transport_sources }}"

      - name: Fail closed on unclassified provider/data errors
        if: steps.pair.outputs.should_run == 'true' && steps.attempt_outcome.outputs.review_sources != ''
        run: |
          echo "FORMAL_V3_SOURCE_DATA_ERROR_REQUIRES_REVIEW: ${{ steps.attempt_outcome.outputs.review_sources }}" >&2
          exit 1

      - name: Record scheduled no-op
        if: steps.pair.outputs.should_run != 'true'
        run: |
          echo "V3 formal collector no-op: ${{ steps.pair.outputs.reason }}"
