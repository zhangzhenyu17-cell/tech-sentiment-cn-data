name: prospective-context-raw-preopen-v2

on:
  workflow_dispatch:
    inputs:
      market_session_date:
        description: Market session date T (YYYY-MM-DD); formal V3-backed assembly uses exact immutable source observations
        required: true
        type: string
      decision_date:
        description: Immediate next A-share trading day T+1 (YYYY-MM-DD); source eligibility cutoff 08:45 and artifact deadline 09:15 Asia/Shanghai
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: prospective-context-raw-preopen-v2
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public data environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "akshare==1.18.94" "pandas==3.0.5" "pytest==8.4.2"
          python -m pip install -e ".[data,dev]"
          python -m pip check

      - name: Download exact immutable V3 capital source packages
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SESSION_DATE: ${{ inputs.market_session_date }}
        run: |
          set -euo pipefail
          mkdir -p formal-v3-packages
          for SOURCE in SSE_588000 SZSE_159915 SSE_TURNOVER SZSE_TURNOVER; do
            TAG="prospective-source-observation-v3-${MARKET_SESSION_DATE}-${SOURCE}"
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            COUNT="$(printf '%s\n' "$ASSETS" | sed '/^$/d' | wc -l | tr -d ' ')"
            if [ "$COUNT" -ne 3 ]; then
              echo "FORMAL_V3_SOURCE_ASSET_SURFACE_MISMATCH: $TAG count=$COUNT" >&2
              exit 1
            fi
            for REQUIRED in "$TAG.tar.gz" "$TAG.sha256" "$TAG.manifest.json"; do
              grep -Fxq "$REQUIRED" <<<"$ASSETS" || {
                echo "FORMAL_V3_SOURCE_PACKAGE_INCOMPLETE: $TAG/$REQUIRED" >&2
                exit 1
              }
            done
            mkdir -p "formal-v3-packages/$SOURCE"
            gh release download "$TAG" \
              --pattern "$TAG.tar.gz" \
              --pattern "$TAG.sha256" \
              --pattern "$TAG.manifest.json" \
              --dir "formal-v3-packages/$SOURCE"
          done

      - name: Resolve exact durable checkpoint identities
        run: |
          set -euo pipefail
          mkdir -p checkpoint-meta
          python scripts/prospective_context_checkpoint_bundle.py expected \
            --operation-date "${{ inputs.market_session_date }}" \
            --out checkpoint-meta/expected.json

      - name: Restore exact immutable completed work units
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="prospective-context-checkpoints-${{ inputs.market_session_date }}"
          mkdir -p checkpoint-manifests checkpoint-restore checkpoint-meta .cache/prospective_context_raw
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" \
              --pattern "pcraw-progress-v1-*.manifest.json" \
              --dir checkpoint-manifests
          fi
          python scripts/prospective_context_checkpoint_bundle.py plan \
            --expected checkpoint-meta/expected.json \
            --manifest-dir checkpoint-manifests \
            --out checkpoint-meta/restore-plan.json
          python - <<'PY' > checkpoint-meta/selected-bases.txt
          import json
          from pathlib import Path
          payload = json.loads(Path("checkpoint-meta/restore-plan.json").read_text(encoding="utf-8"))
          for item in payload.get("selected", []):
              print(item["asset_base"])
          PY
          if gh release view "$TAG" >/dev/null 2>&1; then
            while IFS= read -r base; do
              test -n "$base" || continue
              gh release download "$TAG" \
                --pattern "$base.tar.gz" \
                --pattern "$base.manifest.json" \
                --pattern "$base.sha256" \
                --dir checkpoint-restore
            done < checkpoint-meta/selected-bases.txt
          fi
          python scripts/prospective_context_checkpoint_bundle.py restore \
            --asset-dir checkpoint-restore \
            --cache-root .cache/prospective_context_raw \
            --out checkpoint-meta/restored.json

      - name: Assemble formal V3-backed previous-session public raw inputs
        id: capture
        run: |
          set -euo pipefail
          BUDGET_SECONDS="$(python - <<'PY'
          from datetime import datetime, time
          from zoneinfo import ZoneInfo
          import os

          zone = ZoneInfo("Asia/Shanghai")
          now = datetime.now(zone)
          decision = datetime.strptime(os.environ["DECISION_DATE"], "%Y-%m-%d").date()
          checkpoint_handoff = datetime.combine(decision, time(9, 10), tzinfo=zone)
          remaining = int((checkpoint_handoff - now).total_seconds())
          budget = min(30 * 60, remaining)
          if budget <= 0:
              raise SystemExit(
                  "FORMAL_V3_RAW_ASSEMBLY_CHECKPOINT_HANDOFF_DEADLINE_PASSED_0910"
              )
          print(budget)
          PY
          )"
          echo "Formal V3 raw assembly budget: ${BUDGET_SECONDS}s; checkpoint handoff reserved before 09:10 Asia/Shanghai."
          timeout --signal=TERM --kill-after=60s "${BUDGET_SECONDS}s" \
            python scripts/build_prospective_context_raw_preopen_v2.py \
              --market-session-date "${{ inputs.market_session_date }}" \
              --decision-date "${{ inputs.decision_date }}" \
              --source-commit "$GITHUB_SHA" \
              --v3-package-root formal-v3-packages
        env:
          DECISION_DATE: ${{ inputs.decision_date }}

      - name: Package every completed reusable checkpoint
        id: checkpoint_package
        if: ${{ always() && steps.capture.outcome != 'skipped' }}
        run: |
          set -euo pipefail
          rm -rf dist/prospective_context_checkpoints
          python scripts/prospective_context_checkpoint_bundle.py package \
            --cache-root .cache/prospective_context_raw \
            --out-dir dist/prospective_context_checkpoints \
            --operation-date "${{ inputs.market_session_date }}" \
            --out checkpoint-meta/package-index.json

      - name: Publish immutable completed work units
        if: ${{ always() && steps.checkpoint_package.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY' > checkpoint-meta/package-bases.txt
          import json
          from pathlib import Path
          payload = json.loads(Path("checkpoint-meta/package-index.json").read_text(encoding="utf-8"))
          for item in payload.get("bundles", []):
              print(item["asset_base"])
          PY
          while IFS= read -r base; do
            test -n "$base" || continue
            bash scripts/publish_prospective_context_checkpoint_bundle.sh \
              "prospective-context-checkpoints-${{ inputs.market_session_date }}" \
              dist/prospective_context_checkpoints \
              "$base"
          done < checkpoint-meta/package-bases.txt

      - name: Preserve checkpoint recovery diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: prospective-context-formal-v3-checkpoint-diagnostics-${{ github.run_id }}
          path: |
            checkpoint-meta/
            .cache/prospective_context_raw/runtime_summary.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resolve immutable pre-open capture identity
        if: ${{ steps.capture.outcome == 'success' }}
        id: identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifests = list(
              Path("dist/prospective_context_preopen_packages").glob(
                  "prospective-context-raw-preopen-v2-*.manifest.json"
              )
          )
          if len(manifests) != 1:
              raise SystemExit(f"expected one pre-open package manifest, got {len(manifests)}")
          payload = json.loads(manifests[0].read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={payload['release_tag']}\n")
          PY

      - name: Upload contemporaneous pre-open raw capture artifact
        if: ${{ steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: prospective-context-raw-preopen-v2-${{ inputs.market_session_date }}-for-${{ inputs.decision_date }}
          path: |
            dist/prospective_context_raw_preopen_v2/
            dist/prospective_context_preopen_packages/
          if-no-files-found: error
          retention-days: 90

      - name: Publish, heal, or exact-verify immutable pre-open public raw capture
        if: ${{ steps.capture.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          ROOT="dist/prospective_context_preopen_packages"
          ARCHIVE="$ROOT/$TAG.tar.gz"
          CHECKSUM="$ROOT/$TAG.sha256"
          MANIFEST="$ROOT/$TAG.manifest.json"

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Prospective pre-open public raw Context ${{ inputs.market_session_date }} -> ${{ inputs.decision_date }}" \
              --notes "Formal V3-backed public Context bundle. Capital source observations must be first observed no later than 08:45 Asia/Shanghai; the aggregate artifact must complete by 09:15. No historical backfill, retroactive qualification, outcome read, Production change, or trading-authority change is allowed."
          fi

          mkdir -p existing
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for LOCAL in "$ARCHIVE" "$CHECKSUM" "$MANIFEST"; do
            NAME="$(basename "$LOCAL")"
            if grep -Fxq "$NAME" <<<"$ASSETS"; then
              gh release download "$TAG" --pattern "$NAME" --dir existing
              cmp --silent "$LOCAL" "existing/$NAME" || {
                echo "IMMUTABLE_PREOPEN_PUBLIC_RAW_CAPTURE_CONFLICT: byte drift for $TAG/$NAME" >&2
                exit 1
              }
              echo "Verified existing immutable asset: $NAME"
            else
              gh release upload "$TAG" "$LOCAL"
              echo "Healed missing immutable asset: $NAME"
            fi
          done

          FINAL_ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for REQUIRED in "$TAG.tar.gz" "$TAG.sha256" "$TAG.manifest.json"; do
            grep -Fxq "$REQUIRED" <<<"$FINAL_ASSETS" || {
              echo "IMMUTABLE_PREOPEN_PUBLIC_RAW_CAPTURE_INCOMPLETE_AFTER_HEAL: missing $REQUIRED" >&2
              exit 1
            }
          done
          echo "Immutable pre-open public raw release is complete and exact: $TAG"

      - name: Upload contemporaneous pre-open raw capture artifact
        if: ${{ steps.capture.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: prospective-context-raw-preopen-v2-${{ inputs.market_session_date }}-for-${{ inputs.decision_date }}
          path: |
            dist/prospective_context_raw_preopen_v2/
            dist/prospective_context_preopen_packages/
          if-no-files-found: error
          retention-days: 90
