name: Market Regime V0 Public Raw Input (manual)

# Engineering-only capture of the existing four-index raw rail.
# No schedule, push, PR, workflow_run or automatic dispatch is authorized.
on:
  workflow_dispatch:
    inputs:
      market_date:
        description: "Completed A-share trading date, YYYY-MM-DD (exact data required)"
        required: true
        type: string
      start_date:
        description: "Historical public input start date, YYYY-MM-DD (>=121 trading sessions)"
        required: true
        default: "2025-01-01"
        type: string

permissions:
  contents: read

concurrency:
  group: market-regime-raw-manual-${{ github.event.inputs.market_date }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public raw-data environment
        run: python -m pip install -e ".[data,dev]"
      - name: Check exact date syntax and no future date
        env:
          MARKET_DATE: ${{ inputs.market_date }}
          START_DATE: ${{ inputs.start_date }}
        run: |
          python - <<'PY'
          import os
          from datetime import date
          target = date.fromisoformat(os.environ["MARKET_DATE"])
          start = date.fromisoformat(os.environ["START_DATE"])
          if target.isoformat() != os.environ["MARKET_DATE"] or start.isoformat() != os.environ["START_DATE"]:
              raise SystemExit("dates must be exact YYYY-MM-DD")
          if target > date.today():
              raise SystemExit("future public capture date rejected")
          if start >= target:
              raise SystemExit("start_date must precede market_date")
          PY
      - name: Verify producer and public-only safety boundary
        run: |
          python scripts/audit_public_tree.py
          python -m pytest -q tests/test_market_regime_v0_public_input.py
      - name: Capture existing public four-index input (no private data)
        env:
          MARKET_DATE: ${{ inputs.market_date }}
          START_DATE: ${{ inputs.start_date }}
        run: |
          mkdir -p stage
          python scripts/materialize_market_regime_v0_public_input.py \
            --start-date "$START_DATE" \
            --as-of-date "$MARKET_DATE" \
            --output-csv stage/market_regime_v0_public_input.csv \
            --output-manifest stage/market_regime_v0_public_input.json
      - name: Require exactly requested market date, provider agreement and hash
        env:
          MARKET_DATE: ${{ inputs.market_date }}
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          import pandas as pd
          manifest = json.loads(Path("stage/market_regime_v0_public_input.json").read_text(encoding="utf-8"))
          csv_file = Path("stage/market_regime_v0_public_input.csv")
          frame = pd.read_csv(csv_file, dtype={"index_code": str})
          requested = os.environ["MARKET_DATE"]
          assert manifest["latest_market_date"] == requested, "provider stale: requested exact session unavailable"
          assert manifest["index_codes"] == ["000985", "000300", "000905", "399006"]
          assert manifest["row_count"] == len(frame)
          assert hashlib.sha256(csv_file.read_bytes()).hexdigest() == manifest["csv_sha256"]
          assert set(frame["index_code"]) == set(manifest["index_codes"])
          assert all(n >= 121 for n in manifest["rows_by_index"].values())
          assert manifest["contains_model_output"] is False
          assert manifest["contains_private_evidence"] is False
          assert manifest["public_handoff_ready_grants_private_qualification"] is False
          assert manifest["automatic_trigger"] is False
          PY
      - name: Upload immutable candidate raw files (private qualification not granted)
        uses: actions/upload-artifact@v4
        with:
          name: market-regime-v0-raw-${{ inputs.market_date }}-${{ github.run_id }}
          path: |
            stage/market_regime_v0_public_input.csv
            stage/market_regime_v0_public_input.json
          if-no-files-found: error
          retention-days: 90
