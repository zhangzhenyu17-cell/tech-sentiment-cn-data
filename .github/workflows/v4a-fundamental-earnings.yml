name: v4a-06-fundamental-earnings

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Qualification start date"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Qualification end date"
        required: true
        default: "2026-09-17"
        type: string

concurrency:
  group: v4a-fundamental-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  shards:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download compatible shared bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/shared bundle-meta stage/shared
          python scripts/v4a_persistent_stage_bundle.py key --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --out bundle-meta/shared-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/shared-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/shared
          cp "bundle/shared/${BASE}.manifest.json" bundle-meta/shared.json
          python scripts/v4a_persistent_stage_bundle.py verify --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --archive "bundle/shared/${BASE}.tar.gz" --manifest bundle-meta/shared.json --extract-to stage/shared
      - name: Resolve stage compatibility identity
        run: |
          python scripts/v4a_persistent_stage_bundle.py key --family fundamental \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json --out bundle-meta/stage-key.json
          echo "STAGE_COMPAT=$(python -c 'import json; print(json.load(open("bundle-meta/stage-key.json"))["compatibility_key"])' )" >> "$GITHUB_ENV"
      - name: Resolve frozen filing checkpoint reuse
        env:
          START_DATE: ${{ inputs.start_date }}
          END_DATE: ${{ inputs.end_date }}
          CURRENT_SHA: ${{ github.sha }}
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          contract = json.loads(
              Path("reference/v4a_fundamental_checkpoint_reuse_contract_v1.json").read_text(
                  encoding="utf-8"
              )
          )
          if contract.get("schema_version") != "v4a-fundamental-checkpoint-reuse-v1":
              raise SystemExit("fundamental checkpoint reuse contract schema mismatch")
          if contract.get("status") != "FROZEN_ENGINEERING_CHECKPOINT_REUSE":
              raise SystemExit("fundamental checkpoint reuse contract is not frozen")
          hard_boundary_flags = (
              "acquisition_semantics_changed",
              "checkpoint_schema_changed",
              "evidence_source_eligibility_changed",
              "pit_no_lookahead_semantics_changed",
              "research_scope_changed",
              "future_outcomes_used",
              "production_authority_changed",
              "trading_authority_changed",
          )
          if any(bool(contract.get(key)) for key in hard_boundary_flags):
              raise SystemExit("fundamental checkpoint reuse contract boundary drift")

          if bool(contract.get("parser_semantics_changed")):
              upgrade = contract.get("parser_upgrade_policy") or {}
              if not isinstance(upgrade, dict):
                  raise SystemExit("fundamental parser upgrade policy missing")
              if upgrade.get("mode") != "SELECTIVE_REPARSE_INCOMPLETE_LEGACY_DOCUMENTS":
                  raise SystemExit("fundamental parser upgrade mode mismatch")
              if upgrade.get("exact_legacy_document_sha256_required") is not True:
                  raise SystemExit("fundamental parser upgrade must require legacy SHA256")
              if upgrade.get("unit_inference_allowed") is not False:
                  raise SystemExit("fundamental parser upgrade cannot infer units")
              if upgrade.get("substitute_document_allowed") is not False:
                  raise SystemExit("fundamental parser upgrade cannot substitute documents")
              if upgrade.get("evidence_eligibility_changed") is not False:
                  raise SystemExit("fundamental parser upgrade cannot change evidence eligibility")

          window = contract.get("qualification_window") or {}
          exact_window = (
              os.environ["START_DATE"] == str(window.get("start_date"))
              and os.environ["END_DATE"] == str(window.get("end_date"))
          )
          if exact_window:
              checkpoint_commit = str(contract["legacy_checkpoint_source_commit"])
              compatibility = str(contract["legacy_stage_compatibility_key"])
              legacy_prefix = (
                  f"v4a-fundamental-{compatibility}-{checkpoint_commit}-"
                  f"{os.environ['SHARD']}-"
              )
          else:
              checkpoint_commit = os.environ["CURRENT_SHA"]
              legacy_prefix = "v4a-fundamental-disabled-legacy-checkpoint-reuse-"

          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as handle:
              handle.write(f"FILING_CHECKPOINT_SOURCE_COMMIT={checkpoint_commit}\n")
              handle.write(f"LEGACY_FILING_CACHE_PREFIX={legacy_prefix}\n")
          PY
      - name: Restore filing checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/capital_pit_v4a/derived/filings
          key: v4a-fundamental-${{ env.STAGE_COMPAT }}-${{ github.sha }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4a-fundamental-${{ env.STAGE_COMPAT }}-${{ github.sha }}-${{ matrix.shard }}-
            ${{ env.LEGACY_FILING_CACHE_PREFIX }}
      - name: Materialize fundamental/earnings shard
        id: materialize
        run: |
          mkdir -p "stage-shard/${{ matrix.shard }}" .cache/capital_pit_v4a/derived/filings
          python scripts/materialize_v4a_fundamental_earnings_shard.py \
            --symbols-csv stage/shared/pit_symbol_scope/capital_pit_symbols.csv \
            --calendar-csv stage/shared/trading_calendar.csv \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --source-commit "${{ github.sha }}" \
            --filing-checkpoint-source-commit "${{ env.FILING_CHECKPOINT_SOURCE_COMMIT }}" \
            --shard-index "${{ matrix.shard }}" --shard-count 4 \
            --checkpoint-dir .cache/capital_pit_v4a/derived/filings \
            --out-dir "stage-shard/${{ matrix.shard }}"
      - name: Save filing checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/capital_pit_v4a/derived/filings
          key: v4a-fundamental-${{ env.STAGE_COMPAT }}-${{ github.sha }}-${{ matrix.shard }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal shard
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py --root "stage-shard/${{ matrix.shard }}" \
            --stage-kind fundamental_earnings --stage-id "fundamental-${{ matrix.shard }}-of-4" \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --out "stage-shard/${{ matrix.shard }}/receipt.json"
      - name: Preserve shard diagnostics
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4a-fundamental-shard-${{ matrix.shard }}-${{ github.run_id }}
          path: stage-shard/${{ matrix.shard }}
          if-no-files-found: error
          retention-days: 30
      - name: Qualification gate
        run: |
          python scripts/assert_v4a_stage_qualifiable.py --kind fundamental_earnings \
            --root "stage-shard/${{ matrix.shard }}"

  package:
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download all successful shards
        uses: actions/download-artifact@v4
        with:
          pattern: v4a-fundamental-shard-*-${{ github.run_id }}
          path: downloads
          merge-multiple: false
      - name: Build group stage
        run: |
          mkdir -p persistent-stage/shards
          for d in downloads/*; do
            name="$(basename "$d")"
            shard="${name#v4a-fundamental-shard-}"
            shard="${shard%-${{ github.run_id }}}"
            mkdir -p "persistent-stage/shards/${shard}"
            cp -a "$d"/. "persistent-stage/shards/${shard}/"
          done
          python scripts/write_v4a_stage_receipt.py --root persistent-stage \
            --stage-kind fundamental_group --stage-id fundamental-all \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --out persistent-stage/receipt.json
      - name: Download shared manifest for lineage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/shared bundle-meta
          python scripts/v4a_persistent_stage_bundle.py key --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --out bundle-meta/shared-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/shared-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/shared
          cp "bundle/shared/${BASE}.manifest.json" bundle-meta/shared.json
      - name: Package and publish persistent bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist
          python scripts/v4a_persistent_stage_bundle.py package --family fundamental \
            --stage-root persistent-stage --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json --out-dir dist --out dist/package.json
          BASE="$(python -c 'import json; print(json.load(open("dist/package.json"))["asset_base"])' )"
          bash scripts/publish_v4a_release_bundle.sh v4a-stage-bundles-v1 dist "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: v4a-persistent-fundamental-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 90
