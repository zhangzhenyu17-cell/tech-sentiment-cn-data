name: one-shot 931152 EastMoney evidence probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-eastmoney-931152.yml"
      - "src/tech_sentiment/eastmoney_fund_holdings_evidence.py"
      - "scripts/research/probe_eastmoney_159992_holdings.py"
      - "tests/test_eastmoney_fund_holdings_evidence.py"

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'data/sector-v0-eastmoney-evidence'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Probe 159992 historical holdings
        run: |
          python scripts/research/probe_eastmoney_159992_holdings.py \
            --output-dir /tmp/931152-eastmoney-evidence \
            --start-year 2020 \
            --end-year 2023
      - name: Show probe report
        if: always()
        run: cat /tmp/931152-eastmoney-evidence/report.json || true
      - name: Upload evidence candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 931152-eastmoney-secondary-evidence
          path: /tmp/931152-eastmoney-evidence
          if-no-files-found: error
          retention-days: 14
