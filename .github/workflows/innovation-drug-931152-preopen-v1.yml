name: innovation-drug-931152-preopen-v1

on:
  workflow_dispatch:
    inputs:
      market_session_date:
        description: Exact completed A-share market session T (YYYY-MM-DD)
        required: true
        type: string
      decision_date:
        description: Immediate next A-share trading day T+1 (YYYY-MM-DD)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: innovation-drug-931152-preopen-v1-${{ inputs.market_session_date }}-${{ inputs.decision_date }}
  cancel-in-progress: false

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public data environment
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[data,dev,sector-data]"

      - name: Capture qualified public-only 931152 pre-open inputs
        run: |
          python scripts/build_innovation_drug_931152_preopen_v1.py \
            --market-session-date "${{ inputs.market_session_date }}" \
            --decision-date "${{ inputs.decision_date }}" \
            --source-commit "$GITHUB_SHA"

      - name: Resolve immutable release identity
        id: identity
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          manifests = list(Path("dist/innovation_drug_931152_preopen_packages").glob("*.manifest.json"))
          if len(manifests) != 1:
              raise SystemExit(f"expected one manifest, got {len(manifests)}")
          payload = json.loads(manifests[0].read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"tag={payload['release_tag']}\n")
          PY

      - name: Publish or exact-verify immutable public raw release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.identity.outputs.tag }}
        run: |
          set -euo pipefail
          ROOT="dist/innovation_drug_931152_preopen_packages"
          ARCHIVE="$ROOT/$TAG.tar.gz"
          CHECKSUM="$ROOT/$TAG.sha256"
          MANIFEST="$ROOT/$TAG.manifest.json"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --target "$GITHUB_SHA" \
              --title "Innovation Drug 931152 public pre-open ${{ inputs.market_session_date }} -> ${{ inputs.decision_date }}" \
              --notes "Public-only 931152 current-session raw inputs for outcome-blind Innovation Drug V1 accrual. No model output, forward outcome, historical backfill, evidence promotion, Production or trading permission."
          fi
          mkdir -p existing
          ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          for LOCAL in "$ARCHIVE" "$CHECKSUM" "$MANIFEST"; do
            NAME="$(basename "$LOCAL")"
            if grep -Fxq "$NAME" <<<"$ASSETS"; then
              gh release download "$TAG" --pattern "$NAME" --dir existing
              cmp --silent "$LOCAL" "existing/$NAME" || {
                echo "IMMUTABLE_931152_PREOPEN_CONFLICT: $TAG/$NAME" >&2
                exit 1
              }
            else
              gh release upload "$TAG" "$LOCAL"
            fi
          done

      - name: Upload contemporaneous public raw artifact
        uses: actions/upload-artifact@v4
        with:
          name: innovation-drug-931152-preopen-v1-${{ inputs.market_session_date }}-for-${{ inputs.decision_date }}
          path: |
            dist/innovation_drug_931152_preopen_v1/
            dist/innovation_drug_931152_preopen_packages/
          if-no-files-found: error
          retention-days: 90
