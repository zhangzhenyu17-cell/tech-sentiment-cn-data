name: sector-931152-official-evidence-probe

on:
  push:
    branches:
      - research/sector-931152-official-evidence-probe

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install research dependencies
        run: python -m pip install -e ".[dev,sector-data]"

      - name: Audit public tree
        run: python scripts/audit_public_tree.py

      - name: Run unit tests before evidence collection
        run: pytest -q

      - name: Collect official CSI candidate evidence
        id: evidence_probe
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p output/931152-csi-evidence
          python scripts/research/probe_csi_931152_adjustments.py \
            --output-dir output/931152-csi-evidence \
            --search-term "关于调整沪深300和中证香港100等指数样本" \
            --search-term "中证创新药产业指数" \
            --search-term "CS创新药" \
            --search-term "931152" \
            > output/931152-csi-evidence/probe_stdout.txt \
            2> output/931152-csi-evidence/probe_stderr.txt

      - name: Summarize probe files
        if: always()
        shell: bash
        run: |
          find output/931152-csi-evidence -maxdepth 2 -type f -print | sort || true
          cat output/931152-csi-evidence/report.json || true
          wc -l output/931152-csi-evidence/931152_changes.csv || true
          cat output/931152-csi-evidence/probe_stderr.txt || true

      - name: Upload candidate evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sector-931152-official-evidence-probe
          path: output/931152-csi-evidence
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve probe failure status
        if: steps.evidence_probe.outcome == 'failure'
        run: exit 1
