name: qualify-931152-oos-inputs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-931152-oos-inputs
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public data environment
        run: python -m pip install -e ".[data,dev,sector-data]"

      - name: Audit public tree and tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q

      - name: Build outcome-free 931152 OOS input package
        run: |
          rm -rf oos_input_artifact
          python scripts/research/build_931152_oos_inputs.py \
            --design-universe data/reference/sector_931152_design_universe.csv \
            --output-dir oos_input_artifact \
            --workers 6 \
            --timeout 20
          tar -czf 931152_oos_inputs_v1.tar.gz -C oos_input_artifact .
          sha256sum 931152_oos_inputs_v1.tar.gz | tee 931152_oos_inputs_v1.sha256

      - name: Upload immutable qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: 931152-oos-inputs-v1
          path: |
            931152_oos_inputs_v1.tar.gz
            931152_oos_inputs_v1.sha256
            oos_input_artifact/report.json
          if-no-files-found: error
          retention-days: 90
