name: qualify-931152-oos-inputs

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qualify-931152-oos-inputs
  cancel-in-progress: false

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install public data environment
        run: python -m pip install -e ".[data,dev,sector-data]"

      - name: Audit public tree and tests
        run: |
          python scripts/audit_public_tree.py
          python -m compileall -q src scripts
          pytest -q

      - name: Restore same-run public input checkpoint
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: 931152-oos-input-checkpoint
          path: oos_input_artifact

      - name: Build outcome-free 931152 OOS input package
        run: |
          mkdir -p oos_input_artifact
          rm -f 931152_oos_inputs_v1.tar.gz 931152_oos_inputs_v1.sha256
          python scripts/research/run_931152_oos_inputs_resumable.py \
            --design-universe data/reference/sector_931152_design_universe.csv \
            --output-dir oos_input_artifact \
            --workers 1 \
            --timeout 20
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("oos_input_artifact/report.json").read_text(encoding="utf-8"))
          if report.get("status") != "HOLDOUT_INPUT_QUALIFIED":
              raise SystemExit(f"unexpected qualification status: {report.get('status')}")
          if report.get("holdout_model_evaluation_opened") is not False:
              raise SystemExit("qualification artifact unexpectedly opened holdout evaluation")
          if report.get("model_events_computed") is not False or report.get("forward_outcomes_computed") is not False:
              raise SystemExit("qualification artifact unexpectedly contains model outcomes")
          PY
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - -C oos_input_artifact . | gzip -n > 931152_oos_inputs_v1.tar.gz
          sha256sum 931152_oos_inputs_v1.tar.gz | tee 931152_oos_inputs_v1.sha256
          sha256sum -c 931152_oos_inputs_v1.sha256

      - name: Print public failure diagnostics
        if: failure()
        run: |
          for file in \
            oos_input_artifact/eastmoney_fetch_audit.jsonl \
            oos_input_artifact/sina_fetch_audit.jsonl \
            oos_input_artifact/stock_download_errors.csv \
            oos_input_artifact/baostock_fetch_failures.jsonl; do
            if [ -f "$file" ]; then
              echo "===== $file ====="
              tail -n 40 "$file"
            fi
          done

      - name: Save resumable public input checkpoint
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 931152-oos-input-checkpoint
          path: |
            oos_input_artifact/sina_*.html
            oos_input_artifact/sina_*.meta.json
            oos_input_artifact/eastmoney_159992_*.txt
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Upload public failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: 931152-oos-input-failure-diagnostics
          path: |
            oos_input_artifact/eastmoney_fetch_audit.jsonl
            oos_input_artifact/sina_fetch_audit.jsonl
            oos_input_artifact/stock_download_errors.csv
            oos_input_artifact/baostock_fetch_failures.jsonl
          if-no-files-found: ignore
          retention-days: 14
          overwrite: true

      - name: Upload immutable qualification artifact
        uses: actions/upload-artifact@v4
        with:
          name: 931152-oos-inputs-v1
          path: |
            931152_oos_inputs_v1.tar.gz
            931152_oos_inputs_v1.sha256
            oos_input_artifact/report.json
          if-no-files-found: error
          retention-days: 90
