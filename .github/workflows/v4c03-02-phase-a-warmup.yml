name: v4c03-02-phase-a-warmup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4c03-02-phase-a-warmup
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Audit public boundary and warm-up contract
        run: |
          python scripts/audit_public_tree.py
          python -m compileall -q src scripts
          pytest -q tests/test_v4c03_phase_a_warmup.py tests/test_v4c03_phase_a_public_universe.py

  materialize:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        universe: [STAR50, ChiNext50]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Materialize public warm-up PIT membership and prices
        run: |
          python scripts/materialize_v4c03_phase_a_public_universe.py \
            --contract reference/v4c03_phase_a_warmup_public_universe_v1.json \
            --source-commit "$GITHUB_SHA" \
            --universe "${{ matrix.universe }}" \
            --out-dir stage
      - name: Assert warm-up remains public-data only and non-sample
        run: |
          UNIVERSE="${{ matrix.universe }}" python - <<'PY'
          import json
          import os
          from pathlib import Path
          import pandas as pd

          receipt = json.loads(Path("stage/receipt.json").read_text())
          assert receipt["status"] == "PUBLIC_PIT_UNIVERSE_AND_PRICES_MATERIALIZED"
          assert receipt["universe"] == os.environ["UNIVERSE"]
          assert receipt["phase"] == "A_WARMUP_ONLY"
          assert receipt["start_date"] == "2021-01-04"
          assert receipt["end_date"] == "2021-06-14"
          assert receipt["sample_eligibility"] is False
          assert receipt["public_only"] is True
          assert receipt["private_model_semantics_present"] is False
          assert receipt["portfolio_or_holdings_data_present"] is False
          assert receipt["forward_result_computation_run"] is False
          assert receipt["production_or_trading_authority_changed"] is False

          forbidden_exact = {
              "false_bottom", "false_top", "mae", "mfe", "max_drawdown",
              "recovery_latency_bars", "opportunity_cost_60d",
          }
          for path in Path("stage").rglob("*.csv"):
              columns = [str(c) for c in pd.read_csv(path, nrows=0).columns]
              bad = [
                  c for c in columns
                  if c.startswith(("ret_", "fwd_")) or c in forbidden_exact
              ]
              if bad:
                  raise SystemExit(f"forbidden research-result columns in {path}: {bad}")
          PY
      - name: Upload reusable warm-up universe work unit
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-warmup-${{ matrix.universe }}-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 90

  assemble:
    needs: materialize
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact successful warm-up work units
        uses: actions/download-artifact@v4
        with:
          pattern: v4c03-phase-a-warmup-*-${{ github.run_id }}
          path: downloads
          merge-multiple: false
      - name: Assemble Phase A warm-up public bundle
        run: |
          python scripts/assemble_v4c03_phase_a_public_bundle.py \
            --star-root "downloads/v4c03-phase-a-warmup-STAR50-${{ github.run_id }}" \
            --chinext-root "downloads/v4c03-phase-a-warmup-ChiNext50-${{ github.run_id }}" \
            --source-commit "$GITHUB_SHA" \
            --start-date "2021-01-04" \
            --end-date "2021-06-14" \
            --phase "A_WARMUP_ONLY" \
            --sample-eligibility "false" \
            --out-dir stage/v4c03_phase_a_warmup
      - name: Package immutable Phase A warm-up public bundle
        run: |
          mkdir -p dist
          python scripts/package_v4c03_warmup_public_bundle.py \
            --stage-root stage/v4c03_phase_a_warmup \
            --source-commit "$GITHUB_SHA" \
            --out-dir dist \
            --out dist/package.json
      - name: Publish immutable Phase A warm-up public bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(python -c 'import json; print(json.load(open("dist/package.json"))["asset_base"])')"
          bash scripts/publish_v4c03_public_bundle.sh v4c03-public-data-v1 dist "$BASE"
      - name: Upload convenient 90-day copy
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-warmup-public-bundle-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
