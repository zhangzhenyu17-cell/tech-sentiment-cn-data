name: one-shot 931152 strict limit coverage probe

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/probe-931152-limit-coverage.yml"
      - "scripts/research/probe_931152_limit_coverage.py"
      - "src/tech_sentiment/sector_limit_coverage_strict.py"
      - "src/tech_sentiment/sector_limit_pipeline.py"
      - "src/tech_sentiment/sector_special_day_semantics.py"
      - "src/tech_sentiment/sector_limit_semantics.py"
      - "data/reference/sector_931152_design_universe.csv"
      - "tests/test_sector_limit_coverage_strict.py"

permissions:
  contents: read

jobs:
  probe:
    if: github.head_ref == 'data/931152-limit-coverage'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install sector data dependencies
        run: python -m pip install -e ".[sector-data]"
      - name: Run strict 931152 design-period coverage probe
        run: |
          python scripts/research/probe_931152_limit_coverage.py \
            --universe data/reference/sector_931152_design_universe.csv \
            --output-dir /tmp/931152-limit-coverage
      - name: Show qualification report
        if: always()
        run: cat /tmp/931152-limit-coverage/report.json || true
      - name: Upload outcome-free coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 931152-strict-limit-coverage
          path: /tmp/931152-limit-coverage
          if-no-files-found: error
          retention-days: 14
