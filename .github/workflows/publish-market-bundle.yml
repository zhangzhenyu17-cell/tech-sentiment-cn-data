name: publish-market-bundle

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: Optional exact latest closed A-share trading session (YYYY-MM-DD); blank preserves ordinary current-day behavior
        required: false
        type: string
  schedule:
    - cron: "30 9 * * 1-5"

concurrency:
  group: publish-market-bundle
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[data,dev]"

      - name: Audit public tree and run tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q

      - name: Resolve market-data window
        env:
          REQUESTED_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime, time, timedelta
          import os
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("Asia/Shanghai")
          now = datetime.now(zone)
          today = now.date()
          requested = os.environ.get("REQUESTED_TARGET_DATE", "").strip()

          if requested:
              import akshare as ak
              import pandas as pd

              target = datetime.strptime(requested, "%Y-%m-%d").date()
              raw = ak.tool_trade_date_hist_sina()
              if raw is None or len(raw) == 0:
                  raise SystemExit("A_SHARE_TRADING_CALENDAR_UNAVAILABLE")
              col = "trade_date" if "trade_date" in raw.columns else raw.columns[0]
              trading_days = (
                  pd.to_datetime(raw[col], errors="raise")
                  .dt.date
                  .drop_duplicates()
                  .sort_values()
                  .tolist()
              )
              closed = [
                  value
                  for value in trading_days
                  if datetime.combine(value, time(15, 0), tzinfo=zone) <= now
              ]
              if not closed or target != closed[-1]:
                  raise SystemExit(
                      "EXACT_BUNDLE_TARGET_MUST_BE_LATEST_CLOSED_A_SHARE_SESSION: "
                      f"requested={target} latest_closed={closed[-1] if closed else None}"
                  )
          else:
              target = today

          print(f"START_DATE={target - timedelta(days=500):%Y-%m-%d}")
          print(f"END_DATE={target:%Y-%m-%d}")
          print(f"REQUESTED_EXACT_TARGET_DATE={requested}")
          PY

      - name: Reuse complete existing immutable dated bundle
        id: immutable_reuse
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="market-bundle-${END_DATE}"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
            COMPLETE=true
            for REQUIRED in "${TAG}.tar.gz" "${TAG}.sha256" "${TAG}.manifest.json"; do
              if ! grep -Fxq "${REQUIRED}" <<<"${ASSETS}"; then
                COMPLETE=false
                echo "Existing immutable release is incomplete; recovery required: missing ${REQUIRED}"
              fi
            done
            if [ "${COMPLETE}" = "true" ]; then
              echo "reuse=true" >> "$GITHUB_OUTPUT"
              echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
              echo "Reusing complete immutable dated release without recomputation: ${TAG}"
              exit 0
            fi
          fi
          echo "reuse=false" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download point-in-time STAR 50 market data
        if: steps.immutable_reuse.outputs.reuse != 'true'
        run: |
          tech-sentiment-data production-index \
            --anchor-manifest data/reference/kc50_anchor_manifest.csv \
            --base-adjustments-csv data/reference/kc50_adjustments_2022_2026.csv \
            --index-code 000688 \
            --expected-constituents 50 \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --adjust qfq \
            --provider tencent \
            --provider eastmoney \
            --retries 1 \
            --retry-backoff-seconds 0.5 \
            --sleep-seconds 0.05 \
            --out-dir data/daily
          tech-sentiment-index-price \
            --index-code 000688 \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --out data/daily/index_prices.csv

      - name: Build allowlisted public bundle and deterministic dated identity
        if: steps.immutable_reuse.outputs.reuse != 'true'
        run: |
          tech-sentiment-bundle \
            --input-dir data/daily \
            --output-dir dist \
            --public-repo-git-sha "$GITHUB_SHA"

      - name: Resolve immutable dated bundle identity
        if: steps.immutable_reuse.outputs.reuse != 'true'
        id: dated
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("dist/market_bundle_manifest.json").read_text(encoding="utf-8"))
          target_date = str(payload["target_date"])
          market_date = str(payload["market_date"])
          publish = target_date == market_date
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"target_date={target_date}\n")
              handle.write(f"market_date={market_date}\n")
              handle.write(f"publish={'true' if publish else 'false'}\n")
          print(
              f"target_date={target_date} market_date={market_date} "
              f"immutable_publish={publish}"
          )
          PY

      - name: Publish latest release assets
        if: steps.immutable_reuse.outputs.reuse != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view latest-market-bundle >/dev/null 2>&1; then
            gh release create latest-market-bundle \
              --target "$GITHUB_SHA" \
              --title "Latest public market-data bundle" \
              --notes "Automated public market-data inputs. No model output or investment signal is included."
          fi
          gh release upload latest-market-bundle \
            dist/market_bundle_latest.tar.gz \
            dist/market_bundle_latest.sha256 \
            dist/market_bundle_manifest.json \
            --clobber

      - name: Publish or exact-verify immutable dated public bundle
        if: steps.immutable_reuse.outputs.reuse != 'true' && steps.dated.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          DATE="${{ steps.dated.outputs.market_date }}"
          BASE="market-bundle-${DATE}"
          TAG="${BASE}"
          ARCHIVE="dist/${BASE}.tar.gz"
          CHECKSUM="dist/${BASE}.sha256"
          MANIFEST="dist/${BASE}.manifest.json"

          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            gh release create "${TAG}" \
              --target "$GITHUB_SHA" \
              --title "Immutable public market bundle ${DATE}" \
              --notes "Immutable dated public market-data inputs for PIT/provenance replay. No private model, signal, portfolio, or evidence qualification is included."
          fi

          mkdir -p existing
          ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          for LOCAL in "${ARCHIVE}" "${CHECKSUM}" "${MANIFEST}"; do
            NAME="$(basename "${LOCAL}")"
            if grep -Fxq "${NAME}" <<<"${ASSETS}"; then
              gh release download "${TAG}" --pattern "${NAME}" --dir existing
              cmp --silent "${LOCAL}" "existing/${NAME}" || {
                echo "IMMUTABLE_DATED_BUNDLE_CONFLICT: byte drift for ${TAG}/${NAME}" >&2
                exit 1
              }
              echo "Verified existing immutable asset: ${NAME}"
            else
              gh release upload "${TAG}" "${LOCAL}"
              echo "Healed missing immutable asset: ${NAME}"
            fi
          done

          FINAL_ASSETS="$(gh release view "${TAG}" --json assets --jq '.assets[].name')"
          for REQUIRED in "${BASE}.tar.gz" "${BASE}.sha256" "${BASE}.manifest.json"; do
            grep -Fxq "${REQUIRED}" <<<"${FINAL_ASSETS}" || {
              echo "IMMUTABLE_DATED_BUNDLE_INCOMPLETE_AFTER_HEAL: missing ${REQUIRED}" >&2
              exit 1
            }
          done
          echo "Immutable dated release is complete and exact: ${TAG}"

      - name: Non-trading target-date receipt
        if: steps.immutable_reuse.outputs.reuse != 'true' && steps.dated.outputs.publish != 'true'
        run: |
          echo "No immutable dated release published because target_date=${{ steps.dated.outputs.target_date }} differs from market_date=${{ steps.dated.outputs.market_date }}."

      - name: Existing immutable dated bundle receipt
        if: steps.immutable_reuse.outputs.reuse == 'true'
        run: |
          echo "Immutable dated release already complete; producer recomputation skipped: ${{ steps.immutable_reuse.outputs.tag }}"
