name: collect-931152-evidence-once

on:
  push:
    branches:
      - data/sector-v0-official-rebalance-collector
    paths:
      - .github/workflows/collect-931152-evidence-once.yml

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package
        run: python -m pip install -e .
      - name: Collect Eastmoney Tiantian Fund 159992 historical anchors
        run: >-
          python scripts/research/probe_eastmoney_159992_holdings.py
          --start-year 2020
          --end-year 2023
          --output-dir output/159992_eastmoney_membership
      - name: Upload evidence artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 159992-eastmoney-membership-evidence
          path: output/159992_eastmoney_membership
          if-no-files-found: error
          retention-days: 14
