name: Cross-Sector Official Price Refresh V1

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cross-sector-price-refresh-v1-2026-09-30
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install public data environment
        run: python -m pip install -e ".[data,dev]"
      - name: Validate public boundary and affected producer
        run: |
          python scripts/audit_public_tree.py
          pytest -q tests/test_cross_sector_relative_mispricing_public_v0.py tests/test_cross_sector_price_refresh_v1.py
      - name: Capture existing official rails
        run: |
          python scripts/materialize_cross_sector_relative_mispricing_v0_public_input.py \
            --as-of-date 2026-09-30 \
            --start-date 2024-01-01 \
            --source-commit "$GITHUB_SHA" \
            --output-csv stage/cross_sector_price.csv \
            --output-manifest stage/cross_sector_price_manifest.json
      - name: Publish explicit public input files
        uses: actions/upload-artifact@v4
        with:
          name: cross-sector-official-price-2026-09-30-v1
          path: |
            stage/cross_sector_price.csv
            stage/cross_sector_price_manifest.json
          if-no-files-found: error
          retention-days: 90
