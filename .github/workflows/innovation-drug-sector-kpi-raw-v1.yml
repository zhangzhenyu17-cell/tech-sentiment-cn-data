name: Innovation Drug Sector KPI Raw V1

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: "Inclusive public-data cutoff date (YYYY-MM-DD)"
        required: true
        default: "2026-09-25"
        type: string

permissions:
  contents: read

env:
  SYMBOL: "600276"
  START_DATE: "2020-01-01"
  CALENDAR_START_DATE: "2019-12-01"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Public-tree and contract tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q tests/test_innovation_drug_sector_kpi_raw_v1.py tests/test_innovation_drug_sector_kpi_workflow_v1.py
      - name: Resolve shared-calendar end
        env:
          END_DATE: ${{ inputs.end_date }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          import pandas as pd
          end = pd.Timestamp(os.environ["END_DATE"]).normalize()
          print(f"END_DATE={end.date()}")
          print(f"CALENDAR_END_DATE={(end + pd.Timedelta(days=21)).date()}")
          PY
      - name: Build real trading calendar
        run: |
          mkdir -p stage/calendar
          python scripts/build_v4a_shared_calendar.py \
            --start-date "$CALENDAR_START_DATE" \
            --end-date "$CALENDAR_END_DATE" \
            --source-commit "$GITHUB_SHA" \
            --out-dir stage/calendar
      - name: Materialize exact 600276 raw Clinical/Regulatory/BD context
        run: |
          python scripts/materialize_innovation_drug_sector_kpi_raw_v1.py \
            --symbol "$SYMBOL" \
            --start-date "$START_DATE" \
            --end-date "$END_DATE" \
            --trading-calendar-csv stage/calendar/trading_calendar.csv \
            --output-dir stage/sector-kpi
      - name: Validate public raw-event boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import pandas as pd

          contract = json.loads(Path("reference/innovation_drug_sector_kpi_raw_v1_contract.json").read_text())
          summary = json.loads(Path("stage/sector-kpi/innovation_drug_sector_kpi_raw_summary.json").read_text())
          events = pd.read_csv("stage/sector-kpi/innovation_drug_sector_kpi_raw_events.csv")

          assert contract["status"] == "FROZEN_OUTCOME_BLIND_RAW_EVENT_CONTEXT_CONTRACT"
          assert contract["scope"]["exact_symbol"] == "600276"
          assert contract["workflow"]["workflow_dispatch_only"] is True
          assert summary["domain_id"] == "INNOVATION_DRUG"
          assert summary["state"] == "RAW_EVENT_CONTEXT_MATERIALIZED_NOT_FORMALLY_QUALIFIED"
          assert summary["source_coverage"]["CNINFO_ANNOUNCEMENT_ARCHIVE"]["state"] == "COMPLETE_WINDOW"
          assert summary["cde_nmpa_snapshot_materialized"] is False
          assert summary["sector_931152_point_in_time_aggregation_computed"] is False
          assert summary["sector_kpi_state_classified"] is False
          assert summary["supportive_or_adverse_direction_classified"] is False
          assert summary["predictive_score_computed"] is False
          assert summary["historical_outcomes_read"] is False
          assert summary["prospective_outcomes_read"] is False
          assert summary["evidence_qualification_changed"] is False
          assert summary["production_changed"] is False
          assert summary["trading_authority_changed"] is False
          assert set(events["entity_id"].astype(str)) <= {"600276.SH"}
          assert not events["direction_classified"].astype(bool).any()
          assert not events["predictive_weight_assigned"].astype(bool).any()
          assert not events["outcome_read"].astype(bool).any()
          PY
      - name: Upload immutable public raw event bundle
        uses: actions/upload-artifact@v4
        with:
          name: innovation-drug-sector-kpi-raw-v1-600276
          path: |
            stage/calendar/trading_calendar_manifest.json
            stage/sector-kpi
            reference/innovation_drug_sector_kpi_raw_v1_contract.json
          if-no-files-found: error
          retention-days: 90
