name: v4a-08-policy

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Qualification start date"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Qualification end date"
        required: true
        default: "2026-09-17"
        type: string

concurrency:
  group: v4a-policy-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Representative CSRC preflight
        run: timeout 10m python scripts/check_csrc_policy_connectivity.py
      - name: Download compatible shared bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/shared bundle-meta stage/shared
          python scripts/v4a_persistent_stage_bundle.py key --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" --out bundle-meta/shared-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/shared-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/shared
          cp "bundle/shared/${BASE}.manifest.json" bundle-meta/shared.json
          python scripts/v4a_persistent_stage_bundle.py verify --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --archive "bundle/shared/${BASE}.tar.gz" --manifest bundle-meta/shared.json --extract-to stage/shared
      - name: Resolve Policy compatibility identity
        run: |
          python scripts/v4a_persistent_stage_bundle.py key --family policy \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json --out bundle-meta/policy-key.json
          echo "STAGE_COMPAT=$(python -c 'import json; print(json.load(open("bundle-meta/policy-key.json"))["compatibility_key"])' )" >> "$GITHUB_ENV"
      - name: Restore policy checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/capital_pit_v4a/derived/policy
          key: v4a-policy-${{ env.STAGE_COMPAT }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4a-policy-${{ env.STAGE_COMPAT }}-${{ github.sha }}-
      - name: Materialize policy/regulatory archive
        id: materialize
        run: |
          mkdir -p stage/policy .cache/capital_pit_v4a/derived/policy
          python scripts/materialize_v4a_policy_stage.py \
            --calendar-csv stage/shared/trading_calendar.csv \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --source-commit "${{ github.sha }}" \
            --checkpoint-dir .cache/capital_pit_v4a/derived/policy \
            --out-dir stage/policy
      - name: Save policy checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/capital_pit_v4a/derived/policy
          key: v4a-policy-${{ env.STAGE_COMPAT }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal policy stage
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py --root stage/policy --stage-kind policy --stage-id policy \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --out stage/policy/receipt.json
      - name: Preserve policy diagnostics before qualification gate
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4a-policy-stage-${{ github.run_id }}
          path: stage/policy
          if-no-files-found: error
          retention-days: 30
      - name: Qualification gate
        run: python scripts/assert_v4a_stage_qualifiable.py --kind policy --root stage/policy
      - name: Package persistent Policy bundle
        run: |
          mkdir -p dist
          python scripts/v4a_persistent_stage_bundle.py package --family policy \
            --stage-root stage/policy --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json --out-dir dist --out dist/package.json
      - name: Publish immutable Policy bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(python -c 'import json; print(json.load(open("dist/package.json"))["asset_base"])' )"
          bash scripts/publish_v4a_release_bundle.sh v4a-stage-bundles-v1 dist "$BASE"
      - uses: actions/upload-artifact@v4
        with:
          name: v4a-persistent-policy-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 90
