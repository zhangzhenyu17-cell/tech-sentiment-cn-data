name: v4a-01-shared-inputs

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Qualification start date"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Qualification end date"
        required: true
        default: "2026-09-17"
        type: string

concurrency:
  group: v4a-shared-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Audit public tree and run tests
        run: timeout 8m bash -c 'python scripts/audit_public_tree.py && pytest -q'
      - name: CNINFO representative protocol smoke
        run: timeout 9m python scripts/check_cninfo_connectivity.py
      - name: CSRC representative protocol smoke
        run: timeout 7m python scripts/check_csrc_policy_connectivity.py
      - name: Issuer representative protocol smoke
        run: timeout 7m python scripts/check_issuer_archive_connectivity.py
      - name: Build shared trading calendar
        run: |
          mkdir -p stage/shared
          timeout 6m python scripts/build_v4a_shared_calendar.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --calendar-index-code "000688" \
            --source-commit "${{ github.sha }}" \
            --out-dir stage/shared
      - name: Validate public-source freshness
        run: |
          timeout 10m python scripts/check_v4a_source_freshness.py \
            --calendar-csv stage/shared/trading_calendar.csv
      - name: Build frozen Capital/PIT symbol scope
        run: |
          python scripts/build_capital_pit_symbol_scope.py \
            --out-dir stage/shared/pit_symbol_scope
      - name: Seal shared stage
        run: |
          python scripts/write_v4a_stage_receipt.py \
            --root stage/shared --stage-kind shared --stage-id shared \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --out stage/shared/receipt.json
      - name: Package persistent shared bundle
        run: |
          mkdir -p dist
          python scripts/v4a_persistent_stage_bundle.py package \
            --family shared \
            --stage-root stage/shared \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ inputs.end_date }}" \
            --out-dir dist \
            --out dist/package.json
      - name: Publish immutable shared bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(python -c 'import json; print(json.load(open("dist/package.json"))["asset_base"])' )"
          bash scripts/publish_v4a_release_bundle.sh v4a-stage-bundles-v1 dist "$BASE"
      - name: Upload convenient 90-day copy
        uses: actions/upload-artifact@v4
        with:
          name: v4a-persistent-shared-${{ github.run_id }}
          path: dist
          if-no-files-found: error
          retention-days: 90
