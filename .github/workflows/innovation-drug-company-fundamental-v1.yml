name: Innovation Drug Company Fundamental V1

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  TARGET_START_DATE: "2022-01-04"
  END_DATE: "2026-09-25"
  CALENDAR_START_DATE: "2020-01-01"

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Public-tree and contract tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q tests/test_innovation_drug_company_fundamental_scope_v1.py tests/test_official_filing_facts.py tests/test_official_filing_extended_pit.py
      - name: Build exact 600276 Innovation Drug scope
        run: |
          mkdir -p stage/scope
          python scripts/build_innovation_drug_company_fundamental_scope_v1.py --repo-root . --out-dir stage/scope
      - name: Build real trading calendar
        run: |
          mkdir -p stage/calendar
          python scripts/build_v4a_shared_calendar.py --start-date "$CALENDAR_START_DATE" --end-date "$END_DATE" --source-commit "$GITHUB_SHA" --out-dir stage/calendar
      - name: Materialize base filing facts and frozen PIT state
        run: |
          python scripts/materialize_v4a_fundamental_earnings_shard.py \
            --symbols-csv stage/scope/innovation_drug_company_fundamental_scope.csv \
            --calendar-csv stage/calendar/trading_calendar.csv \
            --start-date "$TARGET_START_DATE" --end-date "$END_DATE" \
            --source-commit "$GITHUB_SHA" --shard-index 0 --shard-count 1 \
            --checkpoint-dir .cache/innovation_drug_company_fundamental/base \
            --out-dir stage/base
      - name: Materialize extended raw PIT facts
        run: |
          python scripts/materialize_fundamental_extended_pit.py \
            --symbols-csv stage/scope/innovation_drug_company_fundamental_scope.csv \
            --trading-calendar-csv stage/calendar/trading_calendar.csv \
            --target-start-date "$TARGET_START_DATE" --end-date "$END_DATE" \
            --source-commit "$GITHUB_SHA" \
            --checkpoint-dir .cache/innovation_drug_company_fundamental/extended \
            --output-dir stage/extended --warmup-years 2 --fail-on-hard-errors
      - name: Validate exact public bundle boundary
        run: |
          python - <<PY
          import json
          from pathlib import Path
          import pandas as pd
          scope = pd.read_csv("stage/scope/innovation_drug_company_fundamental_scope.csv", dtype=str)
          assert scope["symbol"].tolist() == ["600276"], scope
          base = pd.read_csv("stage/base/filing_coverage.csv", dtype=str)
          ext = pd.read_csv("stage/extended/extended_filing_coverage.csv", dtype=str)
          assert set(base["entity_id"]) == {"600276.SH"}, base
          assert set(ext["entity_id"]) == {"600276.SH"}, ext
          manifest = json.loads(Path("stage/base/stage_manifest.json").read_text())
          assert manifest["future_prices_or_returns_used"] is False
          assert manifest["parameter_search_run"] is False
          assert manifest["predictive_research_run"] is False
          summary = json.loads(Path("stage/extended/extended_filing_summary.json").read_text())
          assert summary["outcome_read"] is False
          assert summary["evidence_qualification_changed"] is False
          PY
      - name: Upload immutable public raw PIT bundle
        uses: actions/upload-artifact@v4
        with:
          name: innovation-drug-company-fundamental-v1-600276
          path: |
            stage/scope
            stage/calendar/trading_calendar_manifest.json
            stage/base
            stage/extended
          if-no-files-found: error
          retention-days: 90
