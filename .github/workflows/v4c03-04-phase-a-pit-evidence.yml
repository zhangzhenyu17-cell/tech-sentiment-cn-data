name: v4c03-04-phase-a-pit-evidence

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v4c03-04-phase-a-pit-evidence
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Audit public boundary
        run: |
          python scripts/audit_public_tree.py
          python -m compileall -q src scripts
          pytest -q tests/test_v4c03_phase_a_pit_evidence.py
      - name: Download exact existing V4C-03 market bundles
        run: |
          set -euo pipefail
          mkdir -p input/release input/phase-a input/warmup stage/inputs
          RELEASE="https://github.com/zhangzhenyu17-cell/tech-sentiment-cn-data/releases/download/v4c03-public-data-v1"
          PHASE_A="v4c03-phase-a-public-universe-20210615-20211231-1efba23d88af6d86505b"
          WARMUP="v4c03-phase-a-warmup-public-universe-20210104-20210614-d4a8dd45915531f24af3"

          for base in "$PHASE_A" "$WARMUP"; do
            curl --fail --location --retry 3 -o "input/release/$base.tar.gz" "$RELEASE/$base.tar.gz"
            curl --fail --location --retry 3 -o "input/release/$base.manifest.json" "$RELEASE/$base.manifest.json"
          done

          echo "23868e45cb77b117eea761e0bcc92ac2908ee7bbcf5b5094459dc87c3bea2ad5  input/release/$PHASE_A.tar.gz" | sha256sum -c -
          echo "5c594b79e3b6a3d9579f54c4a0ee468a39c574ddf6bcf285f9d9d2c74a938565  input/release/$PHASE_A.manifest.json" | sha256sum -c -
          echo "b7f718a6554b210e9e92403f94d6767c583f0c81967879ede73a0b79d3790781  input/release/$WARMUP.tar.gz" | sha256sum -c -
          echo "6442c8b5274570f22f44130b3ca65acd1e65b1ff777819faef4c617d656ccac8  input/release/$WARMUP.manifest.json" | sha256sum -c -

          python - <<'PY'
          import json
          from pathlib import Path
          expected = {
              "v4c03-phase-a-public-universe-20210615-20211231-1efba23d88af6d86505b": {
                  "bundle_identity": "8713ba348104973c3fe206da09511aa7a220363a18d5d47a7e251e36160c8abc",
                  "source_commit": "90cdc261f912c0ebc440d8839bc5231e26de8472",
              },
              "v4c03-phase-a-warmup-public-universe-20210104-20210614-d4a8dd45915531f24af3": {
                  "bundle_identity": "ffccc7ffd3d5e2aff8a6fe74c4ed4b76603835646ffe7994a57a49cd508a97e7",
                  "source_commit": "bfc14419d5d9e876cb45d6b7910a17273869af7c",
              },
          }
          for base, values in expected.items():
              manifest = json.loads(Path(f"input/release/{base}.manifest.json").read_text())
              assert manifest["bundle_identity"] == values["bundle_identity"]
              assert manifest["source_commit"] == values["source_commit"]
              assert manifest["public_only"] is True
              assert manifest["private_model_semantics_present"] is False
              assert manifest["portfolio_or_holdings_data_present"] is False
              assert manifest["forward_result_computation_run"] is False
              assert manifest["production_or_trading_authority_changed"] is False
          PY

          tar -xzf "input/release/$PHASE_A.tar.gz" -C input/phase-a
          tar -xzf "input/release/$WARMUP.tar.gz" -C input/warmup

          python scripts/prepare_v4c03_phase_a_evidence_inputs.py             --phase-a-root input/phase-a             --warmup-root input/warmup             --out-dir stage/inputs
      - name: Assert prepared input boundary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("stage/inputs/receipt.json").read_text())
          assert receipt["status"] == "V4C03_PHASE_A_EVIDENCE_INPUTS_PREPARED"
          assert receipt["evidence_start"] == "2021-01-04"
          assert receipt["sample_start"] == "2021-06-15"
          assert receipt["end_date"] == "2021-12-31"
          assert receipt["sample_eligible_before_sample_start"] is False
          assert receipt["private_model_semantics_present"] is False
          assert receipt["portfolio_or_holdings_data_present"] is False
          assert receipt["forward_result_computation_run"] is False
          assert receipt["production_or_trading_authority_changed"] is False
          PY
      - name: Upload reusable evidence inputs
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: stage/inputs/
          if-no-files-found: error
          retention-days: 90

  issuer:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - slug: cninfo
            source: CNINFO_ANNOUNCEMENT_ARCHIVE
            shard: 0
            count: 4
          - slug: cninfo
            source: CNINFO_ANNOUNCEMENT_ARCHIVE
            shard: 1
            count: 4
          - slug: cninfo
            source: CNINFO_ANNOUNCEMENT_ARCHIVE
            shard: 2
            count: 4
          - slug: cninfo
            source: CNINFO_ANNOUNCEMENT_ARCHIVE
            shard: 3
            count: 4
          - slug: sse
            source: SSE_ANNOUNCEMENT_ARCHIVE
            shard: 0
            count: 1
          - slug: szse
            source: SZSE_ANNOUNCEMENT_ARCHIVE
            shard: 0
            count: 1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact evidence inputs
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: inputs
      - name: Restore issuer checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/v4c03/issuer
          key: v4c03-issuer-${{ matrix.slug }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4c03-issuer-${{ matrix.slug }}-${{ matrix.shard }}-${{ github.sha }}-
      - name: Materialize issuer PIT work unit
        id: materialize
        run: |
          mkdir -p stage .cache/v4c03/issuer
          python scripts/materialize_pit_evidence.py             --symbols-csv inputs/symbols.csv             --start-date 2021-01-04 --end-date 2021-12-31             --calendar-csv inputs/trading_calendar.csv             --source-commit "$GITHUB_SHA"             --source "${{ matrix.source }}"             --shard-index "${{ matrix.shard }}" --shard-count "${{ matrix.count }}"             --checkpoint-dir .cache/v4c03/issuer             --out-dir stage
      - name: Save issuer checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/v4c03/issuer
          key: v4c03-issuer-${{ matrix.slug }}-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal issuer work unit
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py             --root stage --stage-kind issuer             --stage-id "v4c03-${{ matrix.slug }}-${{ matrix.shard }}-of-${{ matrix.count }}"             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out stage/receipt.json
      - name: Upload reusable issuer work unit
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-issuer-${{ matrix.slug }}-${{ matrix.shard }}-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 90

  fundamental:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact evidence inputs
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: inputs
      - name: Restore fundamental checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/v4c03/fundamental
          key: v4c03-fundamental-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4c03-fundamental-${{ matrix.shard }}-${{ github.sha }}-
      - name: Materialize fundamental and earnings work unit
        id: materialize
        run: |
          mkdir -p stage .cache/v4c03/fundamental
          python scripts/materialize_v4a_fundamental_earnings_shard.py             --symbols-csv inputs/symbols.csv             --calendar-csv inputs/trading_calendar.csv             --start-date 2021-01-04 --end-date 2021-12-31             --source-commit "$GITHUB_SHA"             --shard-index "${{ matrix.shard }}" --shard-count 4             --checkpoint-dir .cache/v4c03/fundamental             --out-dir stage
      - name: Save fundamental checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/v4c03/fundamental
          key: v4c03-fundamental-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal fundamental work unit
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py             --root stage --stage-kind fundamental_earnings             --stage-id "v4c03-fundamental-${{ matrix.shard }}-of-4"             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out stage/receipt.json
      - name: Upload reusable fundamental work unit
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-fundamental-${{ matrix.shard }}-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 90

  prices:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact evidence inputs
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: inputs
      - name: Restore price checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/v4c03/prices
          key: v4c03-prices-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4c03-prices-${{ matrix.shard }}-${{ github.sha }}-
      - name: Materialize PIT price work unit
        id: materialize
        run: |
          mkdir -p stage .cache/v4c03/prices
          python scripts/materialize_v4a_price_shard.py             --symbols-csv inputs/symbols.csv             --start-date 2021-01-04 --end-date 2021-12-31             --source-commit "$GITHUB_SHA"             --shard-index "${{ matrix.shard }}" --shard-count 4             --checkpoint-dir .cache/v4c03/prices             --out-dir stage
      - name: Save price checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/v4c03/prices
          key: v4c03-prices-${{ matrix.shard }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal price work unit
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py             --root stage --stage-kind prices             --stage-id "v4c03-prices-${{ matrix.shard }}-of-4"             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out stage/receipt.json
      - name: Upload reusable price work unit
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-prices-${{ matrix.shard }}-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 90

  policy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact evidence inputs
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: inputs
      - name: Restore policy checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/v4c03/policy
          key: v4c03-policy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4c03-policy-${{ github.sha }}-
      - name: Materialize policy work unit
        id: materialize
        run: |
          mkdir -p stage .cache/v4c03/policy
          python scripts/materialize_v4a_policy_stage.py             --calendar-csv inputs/trading_calendar.csv             --start-date 2021-01-04 --end-date 2021-12-31             --source-commit "$GITHUB_SHA"             --checkpoint-dir .cache/v4c03/policy             --out-dir stage
      - name: Save policy checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/v4c03/policy
          key: v4c03-policy-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal policy work unit
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py             --root stage --stage-kind policy --stage-id v4c03-policy             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out stage/receipt.json
      - name: Upload reusable policy work unit
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-policy-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 90

  capital:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact evidence inputs
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: inputs
      - name: Restore capital checkpoints
        uses: actions/cache/restore@v4
        with:
          path: .cache/v4c03/capital
          key: v4c03-capital-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            v4c03-capital-${{ github.sha }}-
      - name: Materialize capital work unit
        id: materialize
        run: |
          mkdir -p stage .cache/v4c03/capital
          python scripts/materialize_v4c03_phase_a_capital.py             --calendar-csv inputs/trading_calendar.csv             --source-commit "$GITHUB_SHA"             --checkpoint-dir .cache/v4c03/capital             --out-dir stage
      - name: Save capital checkpoints
        if: ${{ always() && steps.materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/v4c03/capital
          key: v4c03-capital-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Seal capital work unit
        if: ${{ success() }}
        run: |
          python scripts/write_v4a_stage_receipt.py             --root stage --stage-kind v4c03_capital --stage-id v4c03-capital             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out stage/receipt.json
      - name: Upload reusable capital work unit
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-capital-${{ github.run_id }}
          path: stage/
          if-no-files-found: error
          retention-days: 90

  assemble:
    needs: [issuer, fundamental, prices, policy, capital]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data]"
      - name: Download exact evidence inputs
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-evidence-inputs-${{ github.run_id }}
          path: inputs
      - name: Download issuer work units
        uses: actions/download-artifact@v4
        with:
          pattern: v4c03-phase-a-issuer-*-${{ github.run_id }}
          path: downloads/issuer
          merge-multiple: false
      - name: Download fundamental work units
        uses: actions/download-artifact@v4
        with:
          pattern: v4c03-phase-a-fundamental-*-${{ github.run_id }}
          path: downloads/fundamental
          merge-multiple: false
      - name: Download price work units
        uses: actions/download-artifact@v4
        with:
          pattern: v4c03-phase-a-prices-*-${{ github.run_id }}
          path: downloads/prices
          merge-multiple: false
      - name: Download policy work unit
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-policy-${{ github.run_id }}
          path: downloads/policy
      - name: Download capital work unit
        uses: actions/download-artifact@v4
        with:
          name: v4c03-phase-a-capital-${{ github.run_id }}
          path: downloads/capital
      - name: Aggregate issuer work units
        run: |
          mkdir -p stage/issuer
          python scripts/aggregate_v4a_issuer_shards.py             --shard-root downloads/issuer             --symbols-csv inputs/symbols.csv             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out-dir stage/issuer
          python scripts/write_v4a_stage_receipt.py             --root stage/issuer --stage-kind issuer_aggregate             --stage-id v4c03-issuer-aggregate             --source-commit "$GITHUB_SHA"             --start-date 2021-01-04 --end-date 2021-12-31             --out stage/issuer/receipt.json
      - name: Assemble verified public PIT evidence
        run: |
          mkdir -p stage/derived .cache/v4c03/derived
          python scripts/assemble_v4a_derived_pit.py             --symbols-csv inputs/symbols.csv             --calendar-csv inputs/trading_calendar.csv             --issuer-dir stage/issuer             --fundamental-root downloads/fundamental             --price-root downloads/prices             --policy-dir downloads/policy             --start-date 2021-01-04 --end-date 2021-12-31             --source-commit "$GITHUB_SHA"             --checkpoint-dir .cache/v4c03/derived             --out-dir stage/derived
      - name: Finalize public-only Phase A evidence
        run: |
          python scripts/finalize_v4c03_phase_a_evidence.py             --inputs-dir inputs             --derived-dir stage/derived             --capital-dir downloads/capital             --source-commit "$GITHUB_SHA"             --out-dir stage/final
      - name: Assert final evidence remains outcome blind
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          receipt = json.loads(Path("stage/final/receipt.json").read_text())
          assert receipt["status"] == "V4C03_PHASE_A_PUBLIC_EVIDENCE_MATERIALIZED_OUTCOME_BLIND"
          assert receipt["pre_sample_evidence_sample_eligible"] is False
          assert receipt["public_only"] is True
          assert receipt["private_model_semantics_present"] is False
          assert receipt["portfolio_or_holdings_data_present"] is False
          assert receipt["new_context_outcome_read"] is False
          assert receipt["new_context_forward_outcomes_read"] is False
          assert receipt["outcome_columns_materialized"] is False
          assert receipt["real_outcome_study_executed"] is False
          assert receipt["parameter_search_run"] is False
          assert receipt["feature_search_run"] is False
          assert receipt["threshold_search_run"] is False
          assert receipt["ml_run"] is False
          assert receipt["context_or_cause_semantics_changed"] is False
          assert receipt["universe_changed"] is False
          assert receipt["evidence_qualification_semantics_changed"] is False
          assert receipt["score_mapping_changed"] is False
          assert receipt["production_authority_changed"] is False
          assert receipt["trading_authority_changed"] is False
          PY
      - name: Package immutable public evidence bundle
        run: |
          mkdir -p dist
          python scripts/package_v4c03_phase_a_evidence_bundle.py             --stage-root stage/final             --contract reference/v4c03_phase_a_pit_evidence_v1.json             --source-commit "$GITHUB_SHA"             --out-dir dist             --out dist/package.json
      - name: Publish immutable public evidence bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BASE="$(python -c 'import json; print(json.load(open("dist/package.json"))["asset_base"])')"
          bash scripts/publish_v4c03_public_bundle.sh v4c03-public-evidence-v1 dist "$BASE"
      - name: Upload convenient 90-day public evidence bundle
        uses: actions/upload-artifact@v4
        with:
          name: v4c03-phase-a-pit-evidence-public-bundle-${{ github.run_id }}
          path: dist/
          if-no-files-found: error
          retention-days: 90
