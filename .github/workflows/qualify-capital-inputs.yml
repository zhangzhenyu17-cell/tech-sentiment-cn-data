name: qualify-capital-inputs

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Target start date for Capital/PIT materialization"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Optional end date; blank uses current Asia/Shanghai date"
        required: false
        default: ""
        type: string
      pit_entities:
        description: "Optional comma-separated public issuer ids (e.g. 600276.SH,000001.SZ); blank does not invent a PIT universe"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[data,dev]"

      - name: Audit public tree and run tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q

      - name: Materialize public Capital/PIT inputs
        shell: bash
        run: |
          args=(--start-date "${{ inputs.start_date }}" --out-dir output/capital_pit_materialization)
          if [[ -n "${{ inputs.end_date }}" ]]; then
            args+=(--end-date "${{ inputs.end_date }}")
          fi
          if [[ -n "${{ inputs.pit_entities }}" ]]; then
            args+=(--pit-entities "${{ inputs.pit_entities }}")
          fi
          python scripts/materialize_capital_pit_inputs.py "${args[@]}"

      - name: Upload immutable diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: capital-pit-materialization
          path: output/capital_pit_materialization
          if-no-files-found: error
