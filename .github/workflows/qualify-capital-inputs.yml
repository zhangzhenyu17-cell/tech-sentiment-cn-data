name: qualify-capital-inputs

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date for public input qualification"
        required: true
        default: "2022-01-01"
        type: string
      end_date:
        description: "Optional end date; blank uses current Asia/Shanghai date"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[data,dev]"

      - name: Audit public tree and run tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q

      - name: Run manual public input qualification
        shell: bash
        run: |
          args=(--start-date "${{ inputs.start_date }}" --out-dir output/capital_input_qualification)
          if [[ -n "${{ inputs.end_date }}" ]]; then
            args+=(--end-date "${{ inputs.end_date }}")
          fi
          python scripts/qualify_capital_inputs.py "${args[@]}"

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: capital-input-qualification
          path: output/capital_input_qualification
          if-no-files-found: error
