name: qualify-capital-inputs

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Start date for public input materialization"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Optional end date; blank uses current Asia/Shanghai date"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[data,dev]"

      - name: Audit public tree and run tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q

      - name: Qualification reachability preflight
        run: |
          python scripts/check_v4a_reachability.py \
            --out output/v4a_reachability.json \
            --require-reachable

      - name: CNINFO protocol connectivity preflight
        run: |
          python scripts/check_cninfo_connectivity.py

      - name: Resolve end date
        id: dates
        shell: bash
        run: |
          if [[ -n "${{ inputs.end_date }}" ]]; then
            END_DATE="${{ inputs.end_date }}"
          else
            END_DATE="$(TZ=Asia/Shanghai date +%F)"
          fi
          echo "end_date=${END_DATE}" >> "$GITHUB_OUTPUT"

      - name: Restore exact-identity V4-A checkpoints
        id: checkpoint_restore
        uses: actions/cache/restore@v4
        with:
          path: .cache/capital_pit_v4a
          key: capital-pit-v4a4-${{ github.sha }}-${{ inputs.start_date }}-${{ steps.dates.outputs.end_date }}-${{ github.run_id }}-${{ github.run_attempt }}-restore
          restore-keys: |
            capital-pit-v4a4-${{ github.sha }}-${{ inputs.start_date }}-${{ steps.dates.outputs.end_date }}-

      - name: Prepare checkpoint directories
        shell: bash
        run: |
          mkdir -p \
            .cache/capital_pit_v4a/capital \
            .cache/capital_pit_v4a/financing \
            .cache/capital_pit_v4a/issuer \
            .cache/capital_pit_v4a/derived

      - name: Materialize ETF-share and SSE+SZSE turnover inputs
        id: capital_materialize
        shell: bash
        run: |
          python scripts/qualify_capital_inputs.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ steps.dates.outputs.end_date }}" \
            --calendar-index-code "000688" \
            --source-commit "${{ github.sha }}" \
            --checkpoint-dir .cache/capital_pit_v4a/capital \
            --out-dir output/capital_input_qualification

      - name: Save Capital checkpoints
        if: ${{ always() && steps.capital_materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/capital_pit_v4a
          key: capital-pit-v4a4-${{ github.sha }}-${{ inputs.start_date }}-${{ steps.dates.outputs.end_date }}-${{ github.run_id }}-${{ github.run_attempt }}-capital

      - name: Materialize bilateral financing history
        id: financing_materialize
        shell: bash
        run: |
          python scripts/materialize_financing_history.py \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ steps.dates.outputs.end_date }}" \
            --calendar-index-code "000688" \
            --source-commit "${{ github.sha }}" \
            --checkpoint-dir .cache/capital_pit_v4a/financing \
            --out-dir output/financing_materialization

      - name: Save financing checkpoints
        if: ${{ always() && steps.financing_materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/capital_pit_v4a
          key: capital-pit-v4a4-${{ github.sha }}-${{ inputs.start_date }}-${{ steps.dates.outputs.end_date }}-${{ github.run_id }}-${{ github.run_attempt }}-financing

      - name: Build frozen Capital/PIT symbol scope
        id: scope_build
        shell: bash
        run: |
          python scripts/build_capital_pit_symbol_scope.py \
            --out-dir output/pit_symbol_scope

      - name: Materialize independent CNINFO, SSE and SZSE PIT issuer archives
        id: issuer_pit_materialize
        shell: bash
        run: |
          python scripts/materialize_pit_evidence.py \
            --symbols-csv output/pit_symbol_scope/capital_pit_symbols.csv \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ steps.dates.outputs.end_date }}" \
            --calendar-csv output/capital_input_qualification/trading_calendar.csv \
            --source-commit "${{ github.sha }}" \
            --checkpoint-dir .cache/capital_pit_v4a/issuer \
            --out-dir output/pit_evidence_materialization

      - name: Save issuer PIT checkpoints
        if: ${{ always() && steps.issuer_pit_materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/capital_pit_v4a
          key: capital-pit-v4a4-${{ github.sha }}-${{ inputs.start_date }}-${{ steps.dates.outputs.end_date }}-${{ github.run_id }}-${{ github.run_attempt }}-issuer

      - name: Materialize fundamental, earnings, valuation, policy and major-negative PIT rails
        id: derived_pit_materialize
        shell: bash
        run: |
          python scripts/materialize_v4a_derived_pit.py \
            --symbols-csv output/pit_symbol_scope/capital_pit_symbols.csv \
            --calendar-csv output/capital_input_qualification/trading_calendar.csv \
            --issuer-evidence-csv output/pit_evidence_materialization/pit_evidence.csv \
            --issuer-coverage-csv output/pit_evidence_materialization/pit_source_coverage.csv \
            --issuer-manifest output/pit_evidence_materialization/pit_materialization_manifest.json \
            --start-date "${{ inputs.start_date }}" \
            --end-date "${{ steps.dates.outputs.end_date }}" \
            --source-commit "${{ github.sha }}" \
            --checkpoint-dir .cache/capital_pit_v4a/derived \
            --out-dir output/pit_evidence_materialization

      - name: Save derived PIT checkpoints
        if: ${{ always() && steps.derived_pit_materialize.outcome != 'skipped' }}
        uses: actions/cache/save@v4
        with:
          path: .cache/capital_pit_v4a
          key: capital-pit-v4a4-${{ github.sha }}-${{ inputs.start_date }}-${{ steps.dates.outputs.end_date }}-${{ github.run_id }}-${{ github.run_attempt }}-derived

      - name: Stage frozen Fundamental PIT evidence contract
        shell: bash
        run: |
          cp \
            reference/v4a_fundamental_pit_state_contract_v1.json \
            output/pit_evidence_materialization/fundamental_pit_state_contract_v1.json

      - name: Summarize immutable checkpoint receipts
        shell: bash
        run: |
          python scripts/summarize_v4a_checkpoints.py \
            --checkpoint-root .cache/capital_pit_v4a \
            --source-commit "${{ github.sha }}" \
            --out output/pit_evidence_materialization/checkpoint_receipt_summary.json

      - name: Finalize immutable public materialization bundle
        shell: bash
        run: |
          python scripts/finalize_capital_pit_materialization.py \
            --output-root output \
            --out-dir output/materialization_identity \
            --workflow-run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}"

      - name: Upload immutable materialization artifact
        id: upload_materialization
        uses: actions/upload-artifact@v4
        with:
          name: capital-pit-input-materialization
          path: |
            output/capital_input_qualification
            output/financing_materialization
            output/pit_symbol_scope
            output/pit_evidence_materialization
            output/materialization_identity
          if-no-files-found: error

      - name: Record post-upload artifact identity
        shell: bash
        run: |
          python scripts/write_capital_pit_artifact_receipt.py \
            --preupload-identity output/materialization_identity/bundle_identity_preupload.json \
            --artifact-id "${{ steps.upload_materialization.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.upload_materialization.outputs.artifact-digest }}" \
            --artifact-url "${{ steps.upload_materialization.outputs.artifact-url }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --out output/materialization_identity/artifact_receipt.json

      - name: Upload artifact identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: capital-pit-input-materialization-receipt
          path: output/materialization_identity/artifact_receipt.json
          if-no-files-found: error
