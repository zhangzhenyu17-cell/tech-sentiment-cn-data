name: qualify-capital-inputs

on:
  workflow_dispatch:
    inputs:
      start_date:
        description: "Qualification start date"
        required: true
        default: "2022-01-04"
        type: string
      end_date:
        description: "Qualification end date"
        required: true
        default: "2026-09-17"
        type: string

concurrency:
  group: qualify-capital-inputs-${{ inputs.start_date }}-${{ inputs.end_date }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[data,dev]"
      - name: Audit public tree and finalizer tests
        run: |
          python scripts/audit_public_tree.py
          pytest -q
          python scripts/check_v4a_reachability.py --out output/v4a_reachability.json --require-reachable

      - name: Download and verify shared bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/shared bundle-meta stage/shared
          python scripts/v4a_persistent_stage_bundle.py key --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --out bundle-meta/shared-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/shared-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/shared
          cp "bundle/shared/${BASE}.manifest.json" bundle-meta/shared.json
          python scripts/v4a_persistent_stage_bundle.py verify --family shared \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --archive "bundle/shared/${BASE}.tar.gz" --manifest bundle-meta/shared.json \
            --extract-to stage/shared

      - name: Download and verify Capital and Financing bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for family in capital financing; do
            mkdir -p "bundle/${family}" "stage/${family}"
            python scripts/v4a_persistent_stage_bundle.py key --family "$family" \
              --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
              --input-manifest shared=bundle-meta/shared.json --out "bundle-meta/${family}-key.json"
            base="$(python -c "import json; print(json.load(open('bundle-meta/${family}-key.json'))['asset_base'])")"
            bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$base" "bundle/${family}"
            cp "bundle/${family}/${base}.manifest.json" "bundle-meta/${family}.json"
            python scripts/v4a_persistent_stage_bundle.py verify --family "$family" \
              --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
              --input-manifest shared=bundle-meta/shared.json \
              --archive "bundle/${family}/${base}.tar.gz" --manifest "bundle-meta/${family}.json" \
              --extract-to "stage/${family}"
          done

      - name: Download and verify issuer-source bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for source in cninfo sse szse; do
            family="issuer_${source}"
            mkdir -p "bundle/${family}" "lineage/${family}"
            python scripts/v4a_persistent_stage_bundle.py key --family "$family" \
              --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
              --input-manifest shared=bundle-meta/shared.json --out "bundle-meta/${family}-key.json"
            base="$(python -c "import json; print(json.load(open('bundle-meta/${family}-key.json'))['asset_base'])")"
            bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$base" "bundle/${family}"
            cp "bundle/${family}/${base}.manifest.json" "bundle-meta/${family}.json"
            python scripts/v4a_persistent_stage_bundle.py verify --family "$family" \
              --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
              --input-manifest shared=bundle-meta/shared.json \
              --archive "bundle/${family}/${base}.tar.gz" --manifest "bundle-meta/${family}.json" \
              --extract-to "lineage/${family}"
          done

      - name: Download and verify issuer aggregate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/issuer_aggregate lineage/issuer_aggregate
          python scripts/v4a_persistent_stage_bundle.py key --family issuer_aggregate \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json \
            --input-manifest cninfo=bundle-meta/issuer_cninfo.json \
            --input-manifest sse=bundle-meta/issuer_sse.json \
            --input-manifest szse=bundle-meta/issuer_szse.json \
            --out bundle-meta/issuer_aggregate-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/issuer_aggregate-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/issuer_aggregate
          cp "bundle/issuer_aggregate/${BASE}.manifest.json" bundle-meta/issuer_aggregate.json
          python scripts/v4a_persistent_stage_bundle.py verify --family issuer_aggregate \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json \
            --input-manifest cninfo=bundle-meta/issuer_cninfo.json \
            --input-manifest sse=bundle-meta/issuer_sse.json \
            --input-manifest szse=bundle-meta/issuer_szse.json \
            --archive "bundle/issuer_aggregate/${BASE}.tar.gz" \
            --manifest bundle-meta/issuer_aggregate.json --extract-to lineage/issuer_aggregate

      - name: Download and verify Fundamental, Prices, and Policy bundles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for family in fundamental prices policy; do
            mkdir -p "bundle/${family}" "lineage/${family}"
            python scripts/v4a_persistent_stage_bundle.py key --family "$family" \
              --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
              --input-manifest shared=bundle-meta/shared.json --out "bundle-meta/${family}-key.json"
            base="$(python -c "import json; print(json.load(open('bundle-meta/${family}-key.json'))['asset_base'])")"
            bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$base" "bundle/${family}"
            cp "bundle/${family}/${base}.manifest.json" "bundle-meta/${family}.json"
            python scripts/v4a_persistent_stage_bundle.py verify --family "$family" \
              --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
              --input-manifest shared=bundle-meta/shared.json \
              --archive "bundle/${family}/${base}.tar.gz" --manifest "bundle-meta/${family}.json" \
              --extract-to "lineage/${family}"
          done

      - name: Download and verify Derived bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p bundle/derived stage/derived
          python scripts/v4a_persistent_stage_bundle.py key --family derived \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json \
            --input-manifest issuer=bundle-meta/issuer_aggregate.json \
            --input-manifest fundamental=bundle-meta/fundamental.json \
            --input-manifest prices=bundle-meta/prices.json \
            --input-manifest policy=bundle-meta/policy.json \
            --out bundle-meta/derived-key.json
          BASE="$(python -c 'import json; print(json.load(open("bundle-meta/derived-key.json"))["asset_base"])' )"
          bash scripts/download_v4a_release_bundle.sh v4a-stage-bundles-v1 "$BASE" bundle/derived
          cp "bundle/derived/${BASE}.manifest.json" bundle-meta/derived.json
          python scripts/v4a_persistent_stage_bundle.py verify --family derived \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --input-manifest shared=bundle-meta/shared.json \
            --input-manifest issuer=bundle-meta/issuer_aggregate.json \
            --input-manifest fundamental=bundle-meta/fundamental.json \
            --input-manifest prices=bundle-meta/prices.json \
            --input-manifest policy=bundle-meta/policy.json \
            --archive "bundle/derived/${BASE}.tar.gz" --manifest bundle-meta/derived.json \
            --extract-to stage/derived

      - name: Assemble canonical output tree
        run: |
          mkdir -p output/pit_evidence_materialization
          cp -a stage/capital/capital_input_qualification output/capital_input_qualification
          cp -a stage/financing/financing_materialization output/financing_materialization
          cp -a stage/shared/pit_symbol_scope output/pit_symbol_scope
          cp -a stage/derived/pit_evidence_materialization/. output/pit_evidence_materialization/
          cp reference/v4a_fundamental_pit_state_contract_v1.json \
            output/pit_evidence_materialization/fundamental_pit_state_contract_v1.json

      - name: Build persistent-stage lineage receipt summary
        run: |
          python scripts/build_v4a_stage_lineage_summary.py \
            --source-commit "${{ github.sha }}" \
            --start-date "${{ inputs.start_date }}" --end-date "${{ inputs.end_date }}" \
            --bundle-manifest shared=bundle-meta/shared.json \
            --bundle-manifest capital=bundle-meta/capital.json \
            --bundle-manifest financing=bundle-meta/financing.json \
            --bundle-manifest issuer_cninfo=bundle-meta/issuer_cninfo.json \
            --bundle-manifest issuer_sse=bundle-meta/issuer_sse.json \
            --bundle-manifest issuer_szse=bundle-meta/issuer_szse.json \
            --bundle-manifest issuer_aggregate=bundle-meta/issuer_aggregate.json \
            --bundle-manifest fundamental=bundle-meta/fundamental.json \
            --bundle-manifest prices=bundle-meta/prices.json \
            --bundle-manifest policy=bundle-meta/policy.json \
            --bundle-manifest derived=bundle-meta/derived.json \
            --out output/pit_evidence_materialization/checkpoint_receipt_summary.json

      - name: Finalize immutable public materialization bundle
        run: |
          python scripts/finalize_capital_pit_materialization.py \
            --output-root output \
            --out-dir output/materialization_identity \
            --workflow-run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}"

      - name: Upload immutable materialization artifact
        id: upload_materialization
        uses: actions/upload-artifact@v4
        with:
          name: capital-pit-input-materialization
          path: |
            output/capital_input_qualification
            output/financing_materialization
            output/pit_symbol_scope
            output/pit_evidence_materialization
            output/materialization_identity
          if-no-files-found: error
          retention-days: 90

      - name: Record post-upload artifact identity
        run: |
          python scripts/write_capital_pit_artifact_receipt.py \
            --preupload-identity output/materialization_identity/bundle_identity_preupload.json \
            --artifact-id "${{ steps.upload_materialization.outputs.artifact-id }}" \
            --artifact-digest "${{ steps.upload_materialization.outputs.artifact-digest }}" \
            --artifact-url "${{ steps.upload_materialization.outputs.artifact-url }}" \
            --workflow-run-id "${{ github.run_id }}" \
            --source-commit "${{ github.sha }}" \
            --out output/materialization_identity/artifact_receipt.json

      - name: Upload artifact identity receipt
        uses: actions/upload-artifact@v4
        with:
          name: capital-pit-input-materialization-receipt
          path: output/materialization_identity/artifact_receipt.json
          if-no-files-found: error
          retention-days: 90
