name: engineering-failure-capture

on:
  workflow_run:
    workflows:
      - "publish-market-bundle"
      - "prospective-public-daily-orchestrator-v1"
      - "prospective-context-raw-preopen-v2"
      - "qualify-931152-oos-inputs"
      - "qualify-capital-inputs"
      - "tests"
      - "v4a-01-shared-inputs"
      - "v4a-02-capital"
      - "v4a-03-financing"
      - "v4a-04-issuer-source"
      - "v4a-04b-issuer-szse-migration"
      - "v4a-05-issuer-aggregate"
      - "v4a-06-fundamental-earnings"
      - "v4a-07-prices"
      - "v4a-08-policy"
      - "v4a-09-derived"
      - "v4c03-01-phase-a-public-universe"
      - "v4c03-02-phase-a-warmup"
      - "v4c03-04-phase-a-pit-evidence"
      - "v4c03-04a-phase-a-pit-evidence-recovery"
      - "v4c03-04b-phase-a-turnover-repair"
    types: [completed]

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  capture:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' ||
          github.event.workflow_run.conclusion == 'timed_out' ||
          github.event.workflow_run.conclusion == 'action_required' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Create first-pass Failure Lesson Receipt issue
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const response = await github.rest.actions.listJobsForWorkflowRun({
              owner,
              repo,
              run_id: run.id,
              per_page: 100,
              filter: "latest",
            });
            const failedJobs = response.data.jobs.filter(job =>
              ["failure", "timed_out", "action_required"].includes(job.conclusion)
            );
            const failedSteps = [];
            for (const job of failedJobs) {
              for (const step of (job.steps || [])) {
                if (["failure", "timed_out", "action_required"].includes(step.conclusion)) {
                  failedSteps.push(job.name + " :: " + step.name);
                }
              }
            }

            const safeAutoRepairWorkflows = new Set([
              "tests",
              "publish-market-bundle",
              "prospective-public-daily-orchestrator-v1",
            ]);
            const copilotCandidate = safeAutoRepairWorkflows.has(run.name);

            const attempt = run.run_attempt || 1;
            const marker = "<!-- failure-lesson:" + run.id + ":" + attempt + " -->";
            const title = "[Failure Lesson] " + run.name + " run " + run.id + " attempt " + attempt;
            const query = "repo:" + owner + "/" + repo + " is:issue in:title \"" + title.replace(/"/g, "") + "\"";
            const found = await github.rest.search.issuesAndPullRequests({ q: query });
            if (found.data.total_count > 0) {
              core.info("Failure Lesson issue already exists for run " + run.id + " attempt " + attempt);
              return;
            }

            const started = run.run_started_at || run.created_at || "unknown";
            const completed = run.updated_at || "unknown";
            const jobLines = failedJobs.length
              ? failedJobs.map(job => "- " + job.name + ": " + job.conclusion).join("\n")
              : "- No failed job metadata returned; inspect run directly.";
            const stepLines = failedSteps.length
              ? failedSteps.map(step => "- " + step).join("\n")
              : "- No failed step metadata returned; inspect run directly.";

            const body = [
              marker,
              "# Automatic Failure Lesson Receipt — first pass",
              "",
              "This issue was created automatically by the engineering failure-learning loop.",
              "It is a first-pass capture, not a guessed root-cause conclusion.",
              "",
              "## Identity",
              "",
              "- Repository: " + owner + "/" + repo,
              "- Workflow: " + run.name,
              "- Run ID: " + run.id,
              "- Run attempt: " + attempt,
              "- Conclusion: " + run.conclusion,
              "- Branch/ref: " + (run.head_branch || "unknown"),
              "- Exact SHA: " + (run.head_sha || "unknown"),
              "- Started: " + started,
              "- Completed/updated: " + completed,
              "- Run URL: " + run.html_url,
              "",
              "## Failed jobs",
              "",
              jobLines,
              "",
              "## Failed steps",
              "",
              stepLines,
              "",
              "## First-pass lesson status",
              "",
              "- Root-cause status: `PENDING_ROOT_CAUSE`",
              "- Failure class: `UNCLASSIFIED_PENDING_ROOT_CAUSE`",
              "- Normalized signature: `PENDING_LOG_DIAGNOSIS`",
              "- Protocol decision: `PENDING`",
              "- Later green run alone closes this failure: **false**",
              "- Automatic repair lane: " + (copilotCandidate ? "`COPILOT_CANDIDATE`" : "`DIAGNOSIS_ONLY`"),
              "",
              "## Mandatory closeout",
              "",
              "The repairing agent must finalize the lesson with:",
              "",
              "- verified root cause;",
              "- why the existing preflight/test/guard missed it;",
              "- durable progress / immutable outputs preserved;",
              "- recomputation and avoidable runner waste;",
              "- exact regression test;",
              "- smallest rerun scope;",
              "- `PROTOCOL_CHANGE_REQUIRED` or `NO_PROTOCOL_CHANGE_NEEDED` with reason;",
              "- research/evidence/Production/trading boundary statement.",
              "",
              "This issue reads Actions metadata only and grants no research/evidence/model authority.",
            ].join("\n");

            const created = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });

            if (!copilotCandidate) {
              core.info("Failure is captured but not eligible for autonomous Copilot repair: " + run.name);
              return;
            }

            const instructions = [
              "按 GitHub v1.3 执行。",
              "Inspect the exact failed run and logs before changing code.",
              "This lane is public-data engineering only.",
              "Never introduce private model semantics, thresholds, signals, holdings, private evidence, research results, secrets, or trading authority into the public repository.",
              "Do not change evidence qualification, PIT/no-lookahead semantics, universe, or frozen source meaning.",
              "If the failure is source-not-yet-published, provider outage, data insufficiency, or otherwise has no safe mechanical code fix, do not weaken freshness/PIT/qualification guards. Document the diagnosis instead.",
              "For a deterministic engineering defect, make the smallest mechanical fix, add an exact regression test, preserve immutable completed work/checkpoints, and rerun only the smallest necessary scope.",
              "Do not create new research workflows or broaden automatic triggers.",
            ].join(" ");

            try {
              await github.request(
                "POST /repos/{owner}/{repo}/issues/{issue_number}/assignees",
                {
                  owner,
                  repo,
                  issue_number: created.data.number,
                  assignees: ["copilot-swe-agent[bot]"],
                  agent_assignment: {
                    target_repo: owner + "/" + repo,
                    base_branch: "main",
                    custom_instructions: instructions,
                    custom_agent: "",
                    model: "",
                  },
                  headers: {
                    "X-GitHub-Api-Version": "2022-11-28",
                  },
                }
              );
              core.info("Assigned safe public-engineering Failure Lesson to Copilot cloud agent.");
            } catch (error) {
              core.warning("Copilot auto-assignment unavailable; Failure Lesson remains captured: " + error.message);
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: created.data.number,
                body: [
                  "Automatic Copilot repair handoff was attempted but was unavailable.",
                  "",
                  "The Failure Lesson remains open for the ChatGPT/GitHub v1.3 repair watcher.",
                  "",
                  "Assignment error: `" + String(error.message).replace(/`/g, "'") + "`",
                ].join("\n"),
              });
            }
