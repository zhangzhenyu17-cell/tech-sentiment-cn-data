name: "[LEGACY] prospective-context-raw-v1 — superseded by preopen-v2"

on:
  workflow_dispatch:
    inputs:
      operation_date:
        description: Historical input retained only to make accidental dispatches self-identifying
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: legacy-prospective-context-raw-v1
  cancel-in-progress: false

jobs:
  retired:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Fail closed — Timing V2 is the only active prospective public rail
        run: |
          echo "LEGACY_PROSPECTIVE_RAIL_SUPERSEDED_BY_TIMING_V2" >&2
          echo "prospective-context-raw-v1 is retained only as a historical workflow identity." >&2
          echo "Use prospective-public-daily-orchestrator-v1 -> prospective-context-raw-preopen-v2." >&2
          echo "Historical backfill/replay is not authorized." >&2
          exit 1
