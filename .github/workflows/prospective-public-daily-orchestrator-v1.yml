name: prospective-public-daily-orchestrator-v1

on:
  workflow_dispatch:
    inputs:
      trigger_source:
        description: Audit-only trigger origin; no effect on T/T+1 or evidence semantics
        required: false
        type: string
  schedule:
    # Post-close redundancy begins at 15:15 Asia/Shanghai.
    - cron: "15,45 7-15 * * *"
    - cron: "0,15,30,45 16-23 * * *"
    # Increase wrapper density once source publication historically approaches cutoff.
    - cron: "0,15,30,35,40,45,50,55 0 * * *"
    # Final pre-deadline assembly opportunities. The raw builder still enforces 09:15.
    - cron: "0,5 1 * * *"

permissions:
  actions: write
  contents: read

concurrency:
  group: prospective-public-daily-orchestrator-v1
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11.16"
          cache: pip

      - name: Record invocation provenance
        env:
          TRIGGER_SOURCE: ${{ inputs.trigger_source || github.event_name }}
        run: |
          echo "trigger_source=${TRIGGER_SOURCE}"
          echo "event_name=${GITHUB_EVENT_NAME}"
          echo "No trigger source may override exact T/T+1 resolution or evidence qualification."

      - name: Install exact trading-calendar environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install "akshare==1.18.94" "pandas==3.0.5"

      - name: Resolve exact prospective trading-day pair
        id: pair
        run: |
          python - <<'PY'
          from datetime import datetime, time
          import os
          from zoneinfo import ZoneInfo
          import akshare as ak
          import pandas as pd

          zone = ZoneInfo("Asia/Shanghai")
          now = datetime.now(zone)
          raw = ak.tool_trade_date_hist_sina()
          col = "trade_date" if "trade_date" in raw.columns else raw.columns[0]
          dates = (
              pd.to_datetime(raw[col], errors="raise")
              .dt.normalize()
              .drop_duplicates()
              .sort_values()
          )
          trading_days = dates.dt.date.tolist()

          should_run = False
          session = ""
          decision = ""
          reason = "OUTSIDE_PREOPEN_AUTOMATION_WINDOW"

          # GitHub scheduled workflows can be delivered substantially later than
          # their cron slot. The cron is an invocation allowlist, not permission
          # to dispatch at arbitrary runtime. The formal V3 wrapper may run from
          # 15:15 through 09:05 Asia/Shanghai. Source eligibility is independently
          # frozen at first_observed_at <= 08:45 and the aggregate artifact has a
          # 09:15 completion deadline.
          local_clock = now.time().replace(tzinfo=None)
          runtime_allowlisted = (
              local_clock >= time(15, 15) or local_clock <= time(9, 5)
          )
          if not runtime_allowlisted:
              reason = "OUTSIDE_EXPLICIT_WRAPPER_ALLOWLIST"
          else:
              closed_sessions = [
                  value
                  for value in trading_days
                  if datetime.combine(value, time(15, 0), tzinfo=zone) <= now
              ]
              if closed_sessions:
                  session_date = closed_sessions[-1]
                  later = [value for value in trading_days if value > session_date]
                  if later:
                      decision_date = later[0]
                      session_close = datetime.combine(
                          session_date, time(15, 0), tzinfo=zone
                      )
                      dispatch_deadline = datetime.combine(
                          decision_date, time(9, 5), tzinfo=zone
                      )
                      if session_close <= now <= dispatch_deadline:
                          session = session_date.isoformat()
                          decision = decision_date.isoformat()
                          should_run = True
                          reason = "ACTIVE_SESSION_TO_DECISION_FORMAL_V3_WINDOW"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as h:
              h.write(f"should_run={'true' if should_run else 'false'}\n")
              h.write(f"market_session_date={session}\n")
              h.write(f"decision_date={decision}\n")
              h.write(f"reason={reason}\n")
          print(
              f"should_run={should_run} session={session} decision={decision} "
              f"reason={reason} now={now.isoformat()}"
          )
          PY

      - name: Ensure complete immutable market bundle is requested
        if: steps.pair.outputs.should_run == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SESSION_DATE: ${{ steps.pair.outputs.market_session_date }}
        run: |
          set -euo pipefail
          TAG="market-bundle-$MARKET_SESSION_DATE"
          COMPLETE=false
          if gh release view "$TAG" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
            COMPLETE=true
            for REQUIRED in "$TAG.tar.gz" "$TAG.sha256" "$TAG.manifest.json"; do
              if ! grep -Fxq "$REQUIRED" <<<"$ASSETS"; then
                COMPLETE=false
                echo "Exact immutable market bundle is incomplete: missing $REQUIRED"
              fi
            done
          fi
          if [ "$COMPLETE" = "true" ]; then
            echo "Complete immutable market bundle already exists: $TAG"
            exit 0
          fi

          ACTIVE="$(
            gh run list \
              --workflow publish-market-bundle.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "Market-bundle publisher is already active; not dispatching a duplicate."
            exit 0
          fi

          echo "Complete immutable market bundle missing; dispatching existing publisher."
          gh workflow run publish-market-bundle.yml --ref main \
            -f target_date="$MARKET_SESSION_DATE"

      - name: Ensure V3 source capture and determine formal eligibility
        if: steps.pair.outputs.should_run == 'true'
        id: v3
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SESSION_DATE: ${{ steps.pair.outputs.market_session_date }}
          DECISION_DATE: ${{ steps.pair.outputs.decision_date }}
        run: |
          set -euo pipefail
          mkdir -p v3-formal-manifests
          MISSING=()
          for SOURCE in SSE_588000 SZSE_159915 SSE_TURNOVER SZSE_TURNOVER; do
            TAG="prospective-source-observation-v3-${MARKET_SESSION_DATE}-${SOURCE}"
            COMPLETE=false
            if gh release view "$TAG" >/dev/null 2>&1; then
              ASSETS="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
              COMPLETE=true
              for REQUIRED in "$TAG.tar.gz" "$TAG.sha256" "$TAG.manifest.json"; do
                grep -Fxq "$REQUIRED" <<<"$ASSETS" || COMPLETE=false
              done
            fi
            if [ "$COMPLETE" = "true" ]; then
              gh release download "$TAG" \
                --pattern "$TAG.manifest.json" \
                --dir v3-formal-manifests
            else
              MISSING+=("$SOURCE")
            fi
          done

          if [ "${#MISSING[@]}" -gt 0 ]; then
            ACTIVE="$(
              gh run list \
                --workflow prospective-public-continuous-collector-v3.yml \
                --limit 20 \
                --json status \
                --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
            )"
            if [ "$ACTIVE" -eq 0 ]; then
              RECENT_EXACT=false
              NOW_EPOCH="$(date -u +%s)"
              while IFS=$'\t' read -r RUN_ID CREATED_AT CONCLUSION; do
                [ -n "$RUN_ID" ] || continue
                [ "$CONCLUSION" = "success" ] || continue
                CREATED_EPOCH="$(date -u -d "$CREATED_AT" +%s 2>/dev/null || echo 0)"
                [ "$CREATED_EPOCH" -gt 0 ] || continue
                AGE_SECONDS=$((NOW_EPOCH - CREATED_EPOCH))
                [ "$AGE_SECONDS" -ge 0 ] || continue
                [ "$AGE_SECONDS" -le 1500 ] || continue
                if gh run view "$RUN_ID" --log 2>/dev/null | grep -Fq \
                  "should_run=True session=$MARKET_SESSION_DATE decision=$DECISION_DATE"; then
                  RECENT_EXACT=true
                  echo "Recent successful exact-pair V3 collector suppresses duplicate dispatch: run=$RUN_ID age_seconds=$AGE_SECONDS"
                  break
                fi
              done < <(
                gh run list \
                  --workflow prospective-public-continuous-collector-v3.yml \
                  --limit 10 \
                  --json databaseId,createdAt,conclusion \
                  --jq '.[] | [.databaseId, .createdAt, (.conclusion // "")] | @tsv'
              )

              if [ "$RECENT_EXACT" = "true" ]; then
                echo "Recent exact-pair V3 collector already executed; missing sources: ${MISSING[*]}"
              else
                gh workflow run prospective-public-continuous-collector-v3.yml \
                  --ref main \
                  -f market_session_date="$MARKET_SESSION_DATE" \
                  -f decision_date="$DECISION_DATE"
                echo "Requested V3 collection for missing sources: ${MISSING[*]}"
              fi
            else
              echo "V3 collector already active; missing sources: ${MISSING[*]}"
            fi
            echo "formal_ready=false" >> "$GITHUB_OUTPUT"
            echo "reason=V3_SOURCE_PACKAGES_INCOMPLETE" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime, time
          from pathlib import Path
          from zoneinfo import ZoneInfo

          zone = ZoneInfo("Asia/Shanghai")
          decision = datetime.fromisoformat(os.environ["DECISION_DATE"]).date()
          cutoff = datetime.combine(decision, time(8, 45), tzinfo=zone)
          expected = {"SSE_588000", "SZSE_159915", "SSE_TURNOVER", "SZSE_TURNOVER"}
          found = set()
          for path in sorted(Path("v3-formal-manifests").glob("*.manifest.json")):
              payload = json.loads(path.read_text(encoding="utf-8"))
              source = str(payload.get("source_key") or "")
              if source not in expected or source in found:
                  raise SystemExit("FORMAL_V3_MANIFEST_SOURCE_IDENTITY_INVALID")
              found.add(source)
              if payload.get("observation_timestamp_semantics") != "SOURCE_FETCH_COMPLETION_TIME":
                  raise SystemExit("FORMAL_V3_SOURCE_TIMESTAMP_SEMANTICS_INVALID")
              if payload.get("shadow_decision_eligible") is not True:
                  raise SystemExit("FORMAL_V3_SOURCE_NOT_DECISION_ELIGIBLE")
              if payload.get("formal_evidence_handoff") is not False:
                  raise SystemExit("FORMAL_V3_SOURCE_HANDOFF_FLAG_DRIFT")
              if payload.get("historical_backfill_allowed") is not False:
                  raise SystemExit("FORMAL_V3_SOURCE_BACKFILL_FLAG_DRIFT")
              if payload.get("retroactive_evidence_qualification_allowed") is not False:
                  raise SystemExit("FORMAL_V3_SOURCE_RETROACTIVE_FLAG_DRIFT")
              observed = datetime.fromisoformat(
                  str(payload.get("first_observed_at_asia_shanghai") or "")
              )
              if observed.tzinfo is None:
                  raise SystemExit("FORMAL_V3_SOURCE_TIMESTAMP_NAIVE")
              if observed.astimezone(zone) > cutoff:
                  raise SystemExit("FORMAL_V3_SOURCE_AFTER_0845_CUTOFF")
          if found != expected:
              raise SystemExit("FORMAL_V3_MANIFEST_SET_INCOMPLETE")
          print("FORMAL_V3_SOURCE_SET_ELIGIBLE")
          PY
          echo "formal_ready=true" >> "$GITHUB_OUTPUT"
          echo "reason=FORMAL_V3_SOURCE_SET_ELIGIBLE" >> "$GITHUB_OUTPUT"

      - name: Dispatch exact V3-backed public raw assembly once
        if: steps.pair.outputs.should_run == 'true' && steps.v3.outputs.formal_ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKET_SESSION_DATE: ${{ steps.pair.outputs.market_session_date }}
          DECISION_DATE: ${{ steps.pair.outputs.decision_date }}
        run: |
          set -euo pipefail
          RAW_TAG="prospective-context-raw-preopen-v2-${MARKET_SESSION_DATE}-for-${DECISION_DATE}"
          COMPLETE=false
          if gh release view "$RAW_TAG" >/dev/null 2>&1; then
            ASSETS="$(gh release view "$RAW_TAG" --json assets --jq '.assets[].name')"
            COMPLETE=true
            for REQUIRED in "$RAW_TAG.tar.gz" "$RAW_TAG.sha256" "$RAW_TAG.manifest.json"; do
              if ! grep -Fxq "$REQUIRED" <<<"$ASSETS"; then
                COMPLETE=false
                echo "Exact immutable public raw release is incomplete: missing $REQUIRED"
              fi
            done
          fi
          HANDOFF_READY=false
          HANDOFF_NAME="$RAW_TAG"
          MATCH_COUNT=0
          if [ "$COMPLETE" = "true" ]; then
            while IFS=$'\t' read -r RUN_ID CONCLUSION; do
              [ -n "$RUN_ID" ] || continue
              [ "$CONCLUSION" = "success" ] || continue
              ARTIFACT_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=${HANDOFF_NAME}&per_page=100")"
              while IFS=$'\t' read -r EXPIRED DIGEST; do
                [ "$EXPIRED" = "false" ] || continue
                case "$DIGEST" in
                  sha256:*) MATCH_COUNT=$((MATCH_COUNT + 1)) ;;
                esac
              done < <(jq -r '.artifacts[]? | [.expired, (.digest // "")] | @tsv' <<<"$ARTIFACT_JSON")
            done < <(
              gh run list \
                --workflow prospective-context-raw-preopen-v2.yml \
                --limit 100 \
                --json databaseId,conclusion \
                --jq '.[] | [.databaseId, (.conclusion // "")] | @tsv'
            )
            if [ "$MATCH_COUNT" -eq 1 ]; then
              HANDOFF_READY=true
            fi
          fi
          if [ "$COMPLETE" = "true" ] && [ "$HANDOFF_READY" = "true" ]; then
            echo "Complete immutable public raw release and unique successful SHA-256 handoff already exist: $RAW_TAG"
            exit 0
          fi
          if [ "$COMPLETE" = "true" ]; then
            echo "PUBLIC_RAW_HANDOFF_INCOMPLETE: durable release exists but exact successful unique SHA-256 handoff is missing; recovery dispatch remains eligible."
          fi

          ACTIVE="$(
            gh run list \
              --workflow prospective-context-raw-preopen-v2.yml \
              --limit 20 \
              --json status \
              --jq '[.[] | select(.status == "queued" or .status == "in_progress")] | length'
          )"
          if [ "$ACTIVE" -gt 0 ]; then
            echo "A pre-open public raw capture is already active; not dispatching a duplicate."
            exit 0
          fi

          gh workflow run prospective-context-raw-preopen-v2.yml \
            --ref main \
            -f market_session_date="$MARKET_SESSION_DATE" \
            -f decision_date="$DECISION_DATE"
          echo "Dispatched formal V3-backed public raw assembly: ${MARKET_SESSION_DATE} -> ${DECISION_DATE}"

      - name: Record non-trading/no-op state
        if: steps.pair.outputs.should_run != 'true'
        run: |
          echo "No prospective public dispatch required: ${{ steps.pair.outputs.reason }}"

      - name: Record waiting-for-V3 state
        if: steps.pair.outputs.should_run == 'true' && steps.v3.outputs.formal_ready != 'true'
        run: |
          echo "Formal public raw assembly is waiting for eligible V3 source packages: ${{ steps.v3.outputs.reason }}"
